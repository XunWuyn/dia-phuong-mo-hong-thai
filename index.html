                    <div><div className="font-bold text-slate-900">{t.title}</div><div className="text-slate-500">{t.village} · hạn {kpiFmtDate(t.deadline)}</div></div>
                    <div className="flex items-center gap-2"><KpiBadge status={t.status} /><span className={kpiIsOverdue(t, today) ? 'text-rose-600 font-bold' : 'text-slate-500'}>{kpiDueText(t, today)}</span></div>
                  </button>
                ))}
              </div>
            )}
          </div>

          <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-3" data-kpi="task-list">
            <h4 className="text-sm font-extrabold text-slate-900">Danh sách nhiệm vụ ({listed.length})</h4>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs min-w-[640px]">
                <thead className="bg-slate-100 font-bold uppercase">
                  <tr><th className="p-3">Nhiệm vụ</th><th className="p-3">Thôn</th><th className="p-3">Thời hạn</th><th className="p-3">Trạng thái</th><th className="p-3 w-32">Tiến độ</th><th className="p-3"></th></tr>
                </thead>
                <tbody className="divide-y">
                  {listed.map(t => (
                    <tr key={t.id} data-kpi-task={t.id}>
                      <td className="p-3"><div className="font-bold text-slate-900">{t.title}</div><div className="text-slate-400">{t.group} · {t.priority}</div></td>
                      <td className="p-3">{t.village}</td>
                      <td className="p-3 whitespace-nowrap"><div>{kpiFmtDate(t.deadline)}</div><div className={kpiIsOverdue(t, today) ? 'text-rose-600 font-bold' : 'text-slate-400'}>{kpiDueText(t, today)}</div></td>
                      <td className="p-3"><KpiBadge status={t.status} /></td>
                      <td className="p-3"><div className="space-y-1"><div className="text-[10px] text-slate-500">{t.status === 'completed' ? 100 : kpiClamp(t.progress)}%</div><KpiBar value={t.status === 'completed' ? 100 : t.progress} color="bg-blue-500" /></div></td>
                      <td className="p-3"><button type="button" onClick={() => setViewId(t.id)} className="px-3 py-1.5 rounded-lg bg-slate-900 text-white font-bold hover:bg-slate-700" data-kpi="open-task">Xem</button></td>
                    </tr>
                  ))}
                  {listed.length === 0 && <tr><td colSpan="6" className="p-6 text-center text-slate-400 italic">Không có nhiệm vụ phù hợp bộ lọc.</td></tr>}
                </tbody>
              </table>
            </div>
          </div>

          {formState && (
            <KpiTaskFormModal
              initial={formState.task}
              villages={villages}
              onClose={() => setFormState(null)}
              onSave={(v) => {
                if (formState.task) actions.editTask(formState.task.id, v); else actions.createTask(v);
                setFormState(null);
              }}
            />
          )}
          {viewTask && !formState && (
            <KpiTaskModal task={viewTask} mode="admin" village="" actions={actions} onClose={() => setViewId(null)} onEdit={(t) => setFormState({ task: t })} />
          )}
        </div>
      );
    }

    // ---- Màn hình "Nhiệm vụ và KPI của thôn tôi" (Trưởng thôn) ----
    function KpiVillagePanel({ appData, setAppData, currentUser, showToast, addLog }) {
      const today = kpiToday();
      const village = currentUser ? currentUser.village : '';
      // Chỉ lấy nhiệm vụ gắn với thôn được phân công
      const tasks = (appData.kpiTasks || []).filter(t => t.village === village);
      const [fStatus, setFStatus] = useState('all');
      const [viewId, setViewId] = useState(null);
      const actions = makeKpiActions({ setAppData, showToast, addLog, actor: `Trưởng thôn ${village}` });
      const stats = kpiStats(tasks, today);
      const listed = tasks
        .filter(t => fStatus === 'all' || (fStatus === 'overdue' ? kpiIsOverdue(t, today) : t.status === fStatus))
        .sort((a, b) => (a.deadline || '').localeCompare(b.deadline || ''));
      const viewTask = viewId ? tasks.find(t => t.id === viewId) : null;

      return (
        <div className="space-y-6" data-kpi="village-panel">
          <div className="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-sm">
            <h3 className="text-lg font-extrabold text-slate-900">Nhiệm vụ và KPI của thôn tôi</h3>
            <p className="text-xs text-slate-500">Bạn chỉ xem và cập nhật nhiệm vụ của {village}. Nhiệm vụ chỉ được tính là hoàn thành sau khi Admin xã duyệt. Dữ liệu chỉ lưu trong trình duyệt này.</p>
          </div>

          <KpiAlertsBox tasks={tasks} mode="village" onOpen={setViewId} />
          <KpiSummary stats={stats} title="KPI của thôn" />

          <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-3" data-kpi="task-list">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <h4 className="text-sm font-extrabold text-slate-900">Danh sách nhiệm vụ ({listed.length})</h4>
              <select value={fStatus} onChange={(e) => setFStatus(e.target.value)} className={`${KPI_INPUT} sm:w-56`} data-kpi="f-status">
                <option value="all">Tất cả trạng thái</option>
                <option value="not_started">Chưa bắt đầu</option>
                <option value="in_progress">Đang thực hiện</option>
                <option value="pending_review">Chờ duyệt</option>
                <option value="completed">Đã hoàn thành</option>
                <option value="overdue">Quá hạn</option>
                <option value="cancelled">Đã hủy</option>
              </select>
            </div>
            {listed.length === 0 ? (
              <p className="text-xs text-slate-400 italic">Chưa có nhiệm vụ nào phù hợp.</p>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {listed.map(t => (
                  <div key={t.id} data-kpi-task={t.id} className="p-4 rounded-2xl border border-slate-200 space-y-2 text-xs">
                    <div className="flex flex-wrap items-center gap-2"><KpiBadge status={t.status} />{kpiIsOverdue(t, today) && <span className="px-2 py-0.5 rounded-full bg-rose-600 text-white text-[10px] font-bold">QUÁ HẠN</span>}{t.revisionRequested && t.status === 'in_progress' && <span className="px-2 py-0.5 rounded-full bg-amber-500 text-white text-[10px] font-bold">CẦN BỔ SUNG</span>}</div>
                    <div className="font-extrabold text-slate-900 text-sm leading-snug">{t.title}</div>
                    <div className="text-slate-500">Hạn {kpiFmtDate(t.deadline)} · <span className={kpiIsOverdue(t, today) ? 'text-rose-600 font-bold' : ''}>{kpiDueText(t, today)}</span> · Ưu tiên {t.priority}</div>
                    <div className="space-y-1"><div className="text-[10px] text-slate-500">Tiến độ {t.status === 'completed' ? 100 : kpiClamp(t.progress)}%</div><KpiBar value={t.status === 'completed' ? 100 : t.progress} color="bg-blue-500" /></div>
                    <button type="button" onClick={() => setViewId(t.id)} className="w-full py-2 rounded-xl bg-forest-600 text-white font-bold hover:bg-forest-500" data-kpi="open-task">{t.status === 'not_started' || t.status === 'in_progress' ? 'Xem và cập nhật' : 'Xem chi tiết'}</button>
                  </div>
                ))}
              </div>
            )}
          </div>

          {viewTask && (
            <KpiTaskModal task={viewTask} mode="village" village={village} actions={actions} onClose={() => setViewId(null)} onEdit={() => {}} />
          )}
        </div>
      );
    }

    // --- CONTEXTUAL AI CHAT WIDGET ---
    function AiChatWidget({ isOpen, setIsOpen, appData, activeTab }) {
      const [tourMessages, setTourMessages] = useState([
        { id: 1, sender: 'ai', text: 'Xin chào! Tôi là Trợ lý AI Du Lịch Hồng Thái. Bạn cần tư vấn lịch trình ruộng bậc thang, thác Bản Tùy hay homestay?', time: 'Vừa xong' }
      ]);
      const [commMessages, setCommMessages] = useState([
        { id: 1, sender: 'ai', text: 'Xin chào bà con! Tôi là AI Cố Vấn Dân Sinh. Bà con muốn tra cứu dân số, lịch tiêm chủng hay gửi phản ánh đến BQL thôn?', time: 'Vừa xong' }
      ]);
      const [inputMsg, setInputMsg] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const chatEndRef = useRef(null);

      const isCommunityMode = activeTab === 'community';

      useEffect(() => {
        if (isOpen && chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [tourMessages, commMessages, isOpen, activeTab]);

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!inputMsg.trim()) return;

        const userText = inputMsg;
        const newMsg = { id: Date.now(), sender: 'user', text: userText, time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) };

        if (isCommunityMode) setCommMessages(prev => [...prev, newMsg]);
        else setTourMessages(prev => [...prev, newMsg]);

        setInputMsg('');
        setIsGenerating(true);

        setTimeout(() => {
          let aiReply = '';
          const lower = userText.toLowerCase();

          if (isCommunityMode) {
            if (lower.includes('dân số') || lower.includes('nhân khẩu')) {
              aiReply = `📊 Tổng hợp nhân khẩu các thôn tại Xã Hồng Thái:\n` + ((appData && appData.villageDetails) || []).map(v => `• ${v.name}: ${v.households} hộ, ${v.population} nhân khẩu${v.isDemo ? ' (số liệu mô phỏng)' : ''}.`).join('\n');
            } else {
              aiReply = `Tôi là Trợ lý Dân sinh BQL Xã Hồng Thái. Tôi hỗ trợ tra cứu số liệu hành chính và hướng dẫn bà con gửi ý kiến lên Ban Quản Lý.`;
            }
            setCommMessages(prev => [...prev, { id: Date.now() + 1, sender: 'ai', text: aiReply, time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) }]);
          } else {
            if (lower.includes('2 ngày') || lower.includes('lịch trình')) {
              aiReply = `Gợi ý Lịch trình Khám phá 2 Ngày 1 Đêm tại Hồng Thái:\n• Ngày 1: Check-in Ruộng bậc thang Khâu Tràng, thưởng thức chè Shan Tuyết, nghỉ đêm homestay Bản Tùy.\n• Ngày 2: Khám phá Thác Bản Tùy, tìm hiểu văn hóa Dao Tiền.`;
            } else {
              aiReply = `Hồng Thái tự hào với ruộng bậc thang, đồi hoa lê, và khí hậu trong lành. Bạn muốn tôi tư vấn lịch trình chi tiết không?`;
            }
            setTourMessages(prev => [...prev, { id: Date.now() + 1, sender: 'ai', text: aiReply, time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) }]);
          }
          setIsGenerating(false);
        }, 1000);
      };

      const currentMessages = isCommunityMode ? commMessages : tourMessages;

      return (
        <div className="fixed bottom-6 right-6 z-50">
          {!isOpen && (
            <button
              onClick={() => setIsOpen(true)}
              className="hn-ai"
            >
              <span className="hn-ai-ico">
                <i data-lucide={isCommunityMode ? "users" : "sparkles"}></i>
              </span>
              <span className="hn-ai-text">
                <small>{isCommunityMode ? 'Quản trị Dân Sinh' : 'Trợ lý AI Du Lịch'}</small>
                <b>{isCommunityMode ? 'Hỏi AI Dân Số' : 'Hỏi AI Lịch Trình'}</b>
              </span>
            </button>
          )}

          {isOpen && (
            <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 w-[90vw] sm:w-[380px] h-[520px] flex flex-col overflow-hidden">
              <div className={`p-4 flex items-center justify-between text-white ${isCommunityMode ? 'bg-community-600' : 'bg-forest-700'}`}>
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-2xl bg-white/20 flex items-center justify-center text-amber-300">
                    <i data-lucide={isCommunityMode ? "building-2" : "sparkles"} className="w-5 h-5"></i>
                  </div>
                  <div>
                    <h4 className="font-extrabold text-sm leading-tight">{isCommunityMode ? 'AI Cố Vấn Dân Sinh' : 'Trợ lý AI Du Lịch Hồng Thái'}</h4>
                    <span className="text-[10px] text-emerald-300 font-medium">● Sẵn sàng hỗ trợ 24/7</span>
                  </div>
                </div>
                <button onClick={() => setIsOpen(false)} className="p-1.5 rounded-xl hover:bg-white/10 text-slate-300 hover:text-white">✕</button>
              </div>

              <div className="flex-1 p-4 overflow-y-auto custom-scrollbar space-y-3 bg-slate-50 text-xs">
                {currentMessages.map(msg => (
                  <div key={msg.id} className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                    <div className={`max-w-[85%] p-3 rounded-2xl leading-relaxed whitespace-pre-line ${msg.sender === 'user' ? 'bg-forest-600 text-white rounded-br-none' : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none font-medium'}`}>
                      {msg.text}
                    </div>
                    <span className="text-[9px] text-slate-400 mt-1 px-1">{msg.time}</span>
                  </div>
                ))}
                {isGenerating && (
                  <div className="flex items-center gap-2 text-slate-400 text-[11px] p-2 bg-white rounded-xl border w-fit">
                    <i data-lucide="loader-2" className="w-3.5 h-3.5 animate-spin text-forest-600"></i> AI đang phân tích dữ liệu...
                  </div>
                )}
                <div ref={chatEndRef} />
              </div>

              <form onSubmit={handleSendMessage} className="p-3 bg-white border-t border-slate-200 flex items-center gap-2">
                <input 
                  type="text" value={inputMsg} onChange={(e) => setInputMsg(e.target.value)}
                  placeholder="Nhập câu hỏi..." className="flex-1 p-2.5 rounded-xl bg-slate-100 text-xs focus:outline-none focus:ring-2 focus:ring-forest-600"
                />
                <button type="submit" disabled={!inputMsg.trim()} className="p-2.5 bg-forest-600 text-white rounded-xl disabled:opacity-40 shadow shrink-0">
                  <i data-lucide="send" className="w-4 h-4"></i>
                </button>
              </form>
            </div>
          )}
        </div>
      );
    }

    // --- THẺ ĐIỂM ĐẾN TRANG CHỦ (phong cách biên tập). DestinationCard bên dưới vẫn được trang Khám phá sử dụng. ---
    // Vị trí cắt ảnh riêng từng điểm đến để không mất chủ thể; điều chỉnh tại đây nếu đổi ảnh.
    const HOME_DEST_IMAGE_POSITION = { 'dest-1': 'center 60%', 'dest-2': 'center 50%', 'dest-3': 'center 55%', 'dest-4': 'center 45%' };
    function HomeDestinationCard({ item, toggleWishlist, isSaved, onClick }) {
      const handleKey = (e) => {
        if (e.target !== e.currentTarget) return;
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick && onClick(); }
      };
      return (
        <article
          className="hp-card"
          onClick={onClick}
          onKeyDown={handleKey}
          role="link"
          tabIndex={0}
          aria-label={item.title + ' — ' + item.village}
        >
          <div className="hp-card-media">
            <img
              src={item.image}
              alt={item.title}
              loading="lazy"
              referrerPolicy="no-referrer"
              style={{ objectPosition: HOME_DEST_IMAGE_POSITION[item.id] || 'center' }}
              onError={(e) => { e.currentTarget.style.display = 'none'; }}
            />
            <button
              type="button"
              className="hp-save"
              aria-pressed={isSaved}
              aria-label={isSaved ? 'Bỏ lưu địa điểm' : 'Lưu địa điểm'}
              onClick={(e) => { e.stopPropagation(); toggleWishlist(item.id); }}
            >
              <i data-lucide="bookmark"></i>
            </button>
          </div>
          <div className="hp-card-body">
            <div className="hp-card-meta">
              <span className="hp-card-village">{item.village}</span>
              <span className="hp-card-cat">{item.category}</span>
            </div>
            <h3 className="hp-card-title">{item.title}</h3>
            <p className="hp-card-desc">{item.description}</p>
            <div className="hp-card-foot">
              <span className="hp-rate">
                <span className="hp-star" aria-hidden="true">★</span>
                <b>{item.rating}</b>
                <small>({item.reviews} đánh giá)</small>
              </span>
              <span className="hp-more">Chi tiết →</span>
            </div>
          </div>
        </article>
      );
    }

    // --- REUSABLE DESTINATION CARD ---
    function DestinationCard({ item, toggleWishlist, isSaved, onClick }) {
      return (
        <div onClick={onClick} className="ex-dc overflow-hidden group cursor-pointer flex flex-col justify-between">
          <div className="relative h-48 overflow-hidden">
            <img src={item.image} alt={item.title} className="w-full h-full object-cover ex-dc-img" />
            <button onClick={(e) => { e.stopPropagation(); toggleWishlist(item.id); }} className={`absolute top-3 right-3 p-2 rounded-full backdrop-blur-md transition ${isSaved ? 'bg-amber-500 text-white' : 'bg-black/30 text-white hover:bg-black/50'}`}>
              <i data-lucide="bookmark" className="w-4 h-4"></i>
            </button>
            <span className="ex-dc-tag">{item.category}</span>
          </div>
          <div className="ex-dc-body flex-1 flex flex-col justify-between">
            <div>
              <div className="ex-dc-village">{item.village}</div>
              <h3 className="ex-dc-title">{item.title}</h3>
              <p className="ex-dc-desc">{item.description}</p>
            </div>
            <div className="ex-dc-foot flex items-center justify-between text-xs">
              <div className="flex items-center gap-1 ex-dc-rate">
                <i data-lucide="star" className="w-3.5 h-3.5 fill-amber-400 text-amber-400"></i>
                <span>{item.rating}</span>
                <span className="text-slate-400 text-[10px]">({item.reviews})</span>
              </div>
              <span className="ex-dc-more group-hover:underline">Chi tiết →</span>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
