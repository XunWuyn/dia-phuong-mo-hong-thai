    // --- TRANG ĐĂNG NHẬP XÁC THỰC HỆ THỐNG (Đã fix hoàn toàn tự động nhận username) ---
    function LoginScreen({ appData, setAppData, loginType, setLoginType, setCurrentUser, setActiveTab, showToast, addLog }) {
      const isAdminFlow = loginType === 'admin';
      const flowRole = isAdminFlow ? 'admin' : 'village_leader';

      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPw, setShowPw] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      // Đổi luồng đăng nhập: xóa sạch username, mật khẩu và lỗi để không giữ nhầm dữ liệu của luồng trước
      useEffect(() => {
        setUsername('');
        setPassword('');
        setShowPw(false);
        setErrorMsg('');
      }, [loginType]);

      // Tài khoản mẫu lấy từ CHÍNH nguồn dữ liệu xác thực (appData.accounts), chỉ hiện đúng vai trò của luồng và đang hoạt động
      const demoAccounts = (appData.accounts || []).filter(
        acc => !acc.deleted && acc.role === flowRole && acc.status === 'active' && acc.password
      );
      const selectedDemo = demoAccounts.find(acc => acc.username === username && String(acc.password) === password);

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setErrorMsg('');

        const cleanUsername = username.trim();
        const foundAcc = (appData.accounts || []).find(acc => !acc.deleted && acc.username === cleanUsername);

        if (!foundAcc) {
          setErrorMsg(`Không tìm thấy tài khoản "${cleanUsername}" trong hệ thống!`);
          return;
        }

        // Chỉ chấp nhận đúng loại tài khoản của luồng đang chọn
        if (foundAcc.role !== flowRole) {
          setErrorMsg(isAdminFlow
            ? 'Tài khoản này không phải tài khoản Admin xã. Vui lòng chọn luồng "Trưởng thôn" để đăng nhập.'
            : 'Tài khoản này không phải tài khoản Trưởng thôn. Vui lòng chọn luồng "Admin xã" để đăng nhập.');
          return;
        }

        if (foundAcc.villageInactive) {
          setErrorMsg('Thôn của tài khoản này không còn trong danh sách hoạt động. Vui lòng liên hệ quản trị viên.');
          return;
        }

        if (foundAcc.status !== 'active') {
          setErrorMsg('Tài khoản này đang bị khóa. Vui lòng liên hệ quản trị viên.');
          return;
        }

        if (foundAcc.password == null || String(foundAcc.password) === '') {
          setErrorMsg('Tài khoản này chưa được đặt mật khẩu nên không thể đăng nhập. Vui lòng liên hệ quản trị viên.');
          return;
        }

        if (String(foundAcc.password) !== password) {
          setErrorMsg('Mật khẩu không chính xác!');
          return;
        }

        if (!isAdminFlow && !(appData.villageDetails || []).some(v => foundAcc.villageId ? v.id === foundAcc.villageId : v.name === foundAcc.village)) {
          setErrorMsg('Tài khoản chưa được gán cho một thôn hợp lệ. Vui lòng liên hệ quản trị viên.');
          return;
        }

        // Ghi nhận lần đăng nhập cuối vào đúng nguồn dữ liệu tài khoản
        const loginAt = new Date().toISOString();
        setAppData(prev => ({ ...prev, accounts: (prev.accounts || []).map(a => a.id === foundAcc.id ? { ...a, lastLogin: loginAt } : a) }));

        // Không lưu mật khẩu vào phiên đăng nhập
        setCurrentUser({
          id: foundAcc.id,
          name: foundAcc.name,
          username: foundAcc.username,
          role: foundAcc.role,
          village: foundAcc.village || '',
          villageId: foundAcc.villageId || ''
        });

        if (isAdminFlow) {
          setActiveTab('admin_social');
          showToast('Đăng nhập thành công tài khoản Quản trị Admin Xã!');
          addLog('Đăng nhập hệ thống Admin Xã', 'Bảo mật');
        } else {
          setActiveTab('admin_leader');
          showToast(`Đăng nhập thành công tài khoản ${foundAcc.village}!`);
          addLog(`Đăng nhập tài khoản thôn ${foundAcc.village}`, 'Bảo mật');
        }
      };

      return (
        <div className="max-w-md mx-auto px-4 py-16 flex-1 flex items-center justify-center w-full">
          <div className="bg-white rounded-3xl p-8 shadow-2xl border border-slate-200 w-full space-y-6">
            <div className="text-center space-y-2">
              <div className={`w-14 h-14 mx-auto rounded-2xl text-white flex items-center justify-center shadow-lg ${isAdminFlow ? 'bg-forest-600' : 'bg-community-600'}`}>
                <i data-lucide="shield-check" className="w-7 h-7"></i>
              </div>
              <h2 className="text-2xl font-black text-slate-900">
                {isAdminFlow ? 'Đăng nhập quản trị cấp xã' : 'Đăng nhập quản trị thôn'}
              </h2>
              <p className="text-xs text-slate-500">
                {isAdminFlow
                  ? 'Đăng nhập để quản lý toàn bộ tài khoản thôn, dữ liệu và hoạt động trên hệ thống'
                  : 'Đăng nhập để quản lý thông tin và hoạt động của thôn được phân công'}
              </p>
            </div>

            <div className="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-bold">
              <button
                type="button"
                onClick={() => setLoginType('admin')}
                className={`py-2 rounded-lg transition ${isAdminFlow ? 'bg-white shadow text-forest-600' : 'text-slate-500 hover:text-slate-800'}`}
              >
                Admin xã
              </button>
              <button
                type="button"
                onClick={() => setLoginType('village')}
                className={`py-2 rounded-lg transition ${!isAdminFlow ? 'bg-white shadow text-community-600' : 'text-slate-500 hover:text-slate-800'}`}
              >
                Trưởng thôn
              </button>
            </div>

            {errorMsg && (
              <div className="animate-shake p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs font-semibold">
                {errorMsg}
              </div>
            )}

            <form onSubmit={handleLoginSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block font-bold text-slate-700 mb-1">Chọn nhanh tài khoản mẫu:</label>
                <select
                  onChange={(e) => {
                    const acc = demoAccounts.find(a => a.username === e.target.value);
                    if (acc) {
                      setUsername(acc.username);
                      setPassword(String(acc.password));
                    } else {
                      setUsername('');
                      setPassword('');
                    }
                    setErrorMsg('');
                  }}
                  value={selectedDemo ? selectedDemo.username : ''}
                  className="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-forest-600 font-medium bg-slate-50"
                >
                  <option value="">-- Chọn tài khoản mẫu (chưa đăng nhập) --</option>
                  {demoAccounts.map(acc => (
                    <option key={acc.id} value={acc.username}>
                      {acc.village ? `${acc.name} - ${acc.village}` : acc.name} ({acc.username})
                    </option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Tên đăng nhập (Username)</label>
                <input
                  type="text"
                  required
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  placeholder="Nhập username..."
                  autoComplete="off"
                  className="w-full p-3.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-forest-600 font-medium bg-slate-50/50"
                />
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Mật khẩu</label>
                <div className="relative">
                  <input
                    type={showPw ? 'text' : 'password'}
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="Nhập mật khẩu..."
                    autoComplete="off"
                    className="w-full p-3.5 pr-16 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-forest-600 font-medium"
                  />
                  <button
                    type="button"
                    onClick={() => setShowPw(prev => !prev)}
                    className="absolute right-3 top-1/2 -translate-y-1/2 text-[11px] font-bold text-slate-500 hover:text-slate-800"
                  >
                    {showPw ? 'Ẩn' : 'Hiện'}
                  </button>
                </div>
              </div>

              <div className="p-3 rounded-xl bg-amber-50 border border-amber-200 text-[11px] text-slate-700 space-y-1">
                <div className="font-bold text-amber-800">Tài khoản demo ({isAdminFlow ? 'Admin xã' : 'Trưởng thôn'})</div>
                {demoAccounts.length === 0 ? (
                  <div className="italic text-slate-500">Hiện không có tài khoản mẫu nào đang hoạt động trong luồng này.</div>
                ) : (
                  demoAccounts.map(acc => (
                    <div key={acc.id} className="font-mono">{acc.username} / {acc.password}</div>
                  ))
                )}
                <div className="italic text-slate-500 pt-1">
                  Thông tin dành cho trình diễn, không phải thông tin đăng nhập thực tế. Mật khẩu lưu trong trình duyệt nên chỉ mang tính mô phỏng, không có giá trị bảo mật.
                </div>
              </div>

              <div className="pt-2 flex flex-col gap-2">
                <button
                  type="submit"
                  className={`w-full py-3.5 text-white font-bold rounded-xl shadow-lg transition ${isAdminFlow ? 'bg-forest-600 hover:bg-forest-500' : 'bg-community-600 hover:bg-community-500'}`}
                >
                  {isAdminFlow ? 'Đăng nhập Admin xã' : 'Đăng nhập tài khoản thôn'}
                </button>
                <button
                  type="button"
                  onClick={() => setActiveTab('home')}
                  className="w-full py-2.5 text-slate-600 font-bold hover:bg-slate-100 rounded-xl transition"
                >
                  ← Quay lại trang chủ
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const EXPLORE_GALLERY_GROUP_NOTE = {
      'cul-tay': 'Các ảnh là hiện vật trang phục của người Tày ở nhiều địa phương (Cao Bằng, Lào Cai...), chưa phải tư liệu ghi nhận trực tiếp tại Hồng Thái.',
      'cul-dao': 'Hồ sơ giới thiệu nhóm Dao Tiền; các ảnh dưới đây ghi theo nhãn của bảo tàng (Dao Đỏ, Lan Tẻn, Thanh Phán). Hiện chưa có ảnh đã xác minh đúng nhóm Dao Tiền tại Hồng Thái.',
      'cul-mong': 'Trang phục Mông khác nhau theo từng nhóm (Hoa, Đen, Han...). Ảnh ghi theo nhãn của bảo tàng, chưa xác minh nhóm Mông nào hiện diện tại Hồng Thái.'
    };
    // Gắn thư viện vào dữ liệu trang phục của từng cộng đồng (costume.gallery) với id ổn định
    EXPLORE_CULTURES.forEach(c => {
      c.costume.gallery = (EXPLORE_COSTUME_GALLERY[c.id] || []).map((g, i) => ({
        id: c.id + '-photo-' + (i + 1), ethnic: c.name, ...g,
        src: exCommonsFileUrl(g.file, 1000), fullSrc: exCommonsFileUrl(g.file, 1600), page: exCommonsPageUrl(g.file),
        source: EXPLORE_COLLECTIONS[g.col]
      }));
    });

    // Dịch vụ: dữ liệu hiện có (appData.services) chỉ có các trường cơ bản. Các trường dưới đây là TÙY CHỌN và chỉ hiển thị khi có:
    //  verified (đã xác minh), phoneVerified + contactPublic (được phép công khai số điện thoại), seller, capacity, amenities[], rules, origin.
    function exServiceKind(s) {
      if (s.category === 'Homestay') return 'homestay';
      if (s.category === 'Đặc sản') return 'product';
      if (s.category === 'Ẩm thực') return 'food';
      return 'other';
    }
    // Nguồn dữ liệu liên hệ duy nhất: serv.contact
    function exContact(s) { return (s && s.contact) ? s.contact : {}; }
    function exVerifyStatus(s) {
      const v = exContact(s).verifyStatus;
      if (v === 'verified' || v === 'pending' || v === 'demo') return v;
      return s && s.verified === true ? 'verified' : 'demo';
    }
    const EX_VERIFY_LABEL = { demo: 'Dữ liệu mô phỏng', pending: 'Chờ xác minh', verified: 'Đã xác minh' };
    const EX_DEMO_PERSON = 'Người phụ trách giả lập — dữ liệu demo';
    const EX_DEMO_WARNING = 'Đây là thông tin mô phỏng để trình diễn website. Cơ sở và người liên hệ chưa được xác minh, vui lòng không sử dụng để giao dịch thực tế.';
    const EX_PENDING_WARNING = 'Thông tin này đang chờ xác minh với cơ sở. Vui lòng không dùng để giao dịch thực tế cho tới khi được xác minh.';
    const EX_ROLE_FALLBACK = { homestay: 'Chủ homestay', product: 'Người bán', food: 'Chủ quán ăn', other: 'Người phụ trách' };
    // Chỉ cho gọi điện khi: đã xác minh + số điện thoại đã xác minh + được phép công khai + số hợp lệ
    function exCanCall(s) {
      const c = exContact(s);
      return !!(exVerifyStatus(s) === 'verified' && c.phone && c.phoneVerified === true && c.contactPublic === true && exValidPhone(c.phone));
    }
    function exTelHref(phone) {
      return 'tel:' + String(phone).replace(/[^0-9+]/g, '');
    }
    function exValidPhone(v) {
      return /^(0\d{9}|\+84\d{9})$/.test(String(v || '').replace(/[\s.\-]/g, ''));
    }
    function exToday() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }
    function exFmtDate(s) {
      return s ? String(s).slice(0, 10).split('-').reverse().join('/') : '';
    }

    // ======================================================================
    // KHÁM PHÁ HỒNG THÁI — THÀNH PHẦN GIAO DIỆN MỚI
    // ======================================================================
    const EX_INPUT = 'w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-forest-600 text-xs bg-white';

    function ExImg({ src, alt, className, caption }) {
      const [failed, setFailed] = useState(false);
      if (!src || failed) {
        return (
          <div className={`${className || ''} bg-gradient-to-br from-forest-500 to-forest-700 text-white flex items-center justify-center text-center p-3`} role="img" aria-label={alt}>
            <span className="text-[11px] font-semibold opacity-90">{caption || 'Ảnh minh họa đang được cập nhật'}</span>
          </div>
        );
      }
      return <img src={src} alt={alt} className={className} onError={() => setFailed(true)} />;
    }

    function ExModal({ onClose, onBack, children, wide, testId }) {
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [onClose]);
      return (
        <div className="fixed inset-0 z-[70] bg-black/60 overflow-y-auto" onClick={onClose} data-ex={testId}>
          <div className="min-h-full flex items-start sm:items-center justify-center p-3 sm:p-6">
            <div onClick={(e) => e.stopPropagation()} className={`relative bg-white rounded-3xl shadow-2xl w-full ${wide ? 'max-w-4xl' : 'max-w-2xl'} overflow-hidden`}>
              <div className="absolute top-3 right-3 z-20 flex gap-2">
                {onBack && <button type="button" onClick={onBack} className="px-3 py-1.5 rounded-full bg-white/90 text-slate-800 text-xs font-bold shadow hover:bg-white" data-ex="back">← Quay lại</button>}
                <button type="button" onClick={onClose} className="px-3 py-1.5 rounded-full bg-slate-900/80 text-white text-xs font-bold shadow hover:bg-slate-900" data-ex="close">Đóng</button>
              </div>
              {children}
            </div>
          </div>
        </div>
      );
    }

    function ExNotice({ tone = 'amber', children }) {
      const T = {
        amber: 'bg-amber-50 border-amber-200 text-amber-900',
        blue: 'bg-blue-50 border-blue-200 text-blue-900',
        emerald: 'bg-emerald-50 border-emerald-200 text-emerald-900',
        slate: 'bg-slate-50 border-slate-200 text-slate-700'
      };
      return <div className={`p-3 rounded-xl border text-xs leading-relaxed ${T[tone]}`}>{children}</div>;
    }

    // ---------------- Thẻ cộng đồng văn hóa ----------------
    function CultureCard({ culture, onOpen }) {

          <div className="ex-cc-media relative overflow-hidden">
            <ExImg src={culture.image} alt={`Hình minh họa văn hóa ${culture.name}`} caption={`Văn hóa ${culture.name}`} className="w-full h-full object-cover ex-cc-img" />
            <span className="ex-cc-tag">Ảnh minh họa · Nội dung tổng quan</span>
          </div>
          <div className="ex-cc-body flex-1 flex flex-col justify-between gap-4">
            <div className="space-y-2">
              <h3 className="ex-cc-title">{culture.title}</h3>
              <p className="ex-cc-desc">{culture.short}</p>
              <p className="ex-cc-verify">Cần xác minh hiện diện tại địa phương</p>
            </div>
            <button type="button" onClick={() => onOpen(culture.id)} className="ex-btn w-full" data-ex="open-culture">
              Khám phá văn hóa {culture.name}

      );
    }

    // ---------------- Chi tiết cộng đồng văn hóa ----------------
    // ---------------- Thư viện ảnh trang phục + xem lớn ----------------
    function ExLightbox({ items, index, onClose, onIndex }) {
      const item = items[index];
      const [failed, setFailed] = useState(false);
      useEffect(() => { setFailed(false); }, [index]);
      useEffect(() => {
        // Escape / mũi tên chỉ tác động lên khung xem ảnh, không đóng cửa sổ văn hóa phía dưới
        const onKey = (e) => {
          if (e.key === 'Escape') { e.stopPropagation(); onClose(); }
          else if (e.key === 'ArrowRight') { e.stopPropagation(); onIndex((index + 1) % items.length); }
          else if (e.key === 'ArrowLeft') { e.stopPropagation(); onIndex((index - 1 + items.length) % items.length); }
        };
        document.addEventListener('keydown', onKey, true);
        return () => document.removeEventListener('keydown', onKey, true);
      }, [index, items.length, onClose, onIndex]);
      if (!item) return null;
      return (
        <div className="fixed inset-0 z-[90] bg-black/90 overflow-y-auto" onClick={onClose} data-ex="lightbox">
          <div className="min-h-full flex items-center justify-center p-3 sm:p-6">
            <div onClick={(e) => e.stopPropagation()} className="relative w-full max-w-3xl space-y-3">
              <div className="flex items-center justify-between text-white text-xs">
                <span data-ex="lightbox-count">Ảnh {index + 1} / {items.length}</span>
                <button type="button" onClick={onClose} className="px-3 py-1.5 rounded-full bg-white text-slate-900 font-bold" data-ex="lightbox-close">Đóng</button>
              </div>
              <div className="relative bg-black rounded-2xl overflow-hidden flex items-center justify-center min-h-[200px]">
                {failed
                  ? <div className="p-10 text-center text-white/80 text-xs">Không tải được ảnh. Bạn có thể xem ảnh gốc tại trang Wikimedia Commons bên dưới.</div>
                  : <img src={item.fullSrc} alt={item.caption} className="max-h-[65vh] w-auto max-w-full object-contain" onError={() => setFailed(true)} data-ex="lightbox-img" />}
                {items.length > 1 && (
                  <>
                    <button type="button" onClick={() => onIndex((index - 1 + items.length) % items.length)} className="absolute left-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/90 text-slate-900 font-black" aria-label="Ảnh trước" data-ex="lightbox-prev">‹</button>
                    <button type="button" onClick={() => onIndex((index + 1) % items.length)} className="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/90 text-slate-900 font-black" aria-label="Ảnh sau" data-ex="lightbox-next">›</button>
                  </>
                )}
              </div>
              <div className="bg-white rounded-2xl p-4 text-xs text-slate-700 leading-relaxed space-y-1" data-ex="lightbox-caption">
                <div className="font-extrabold text-slate-900 text-sm">{item.caption}</div>
                <div><b>Dân tộc:</b> {item.ethnic}</div>
                <div><b>Ảnh thể hiện:</b> {item.shows}</div>
                <div><b>Nguồn:</b> Hiện vật thuộc {item.source}; ảnh đăng trên Wikimedia Commons. <a href={item.page} target="_blank" rel="noopener noreferrer" className="underline text-blue-700 font-semibold" data-ex="lightbox-source">Xem trang tệp (tác giả, giấy phép)</a></div>
                <div className="text-amber-700 font-semibold">{EXPLORE_GALLERY_NOTE}</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ExCostumeGallery({ culture }) {
      const items = culture.costume.gallery || [];
      const [open, setOpen] = useState(-1);
      const close = useCallback(() => setOpen(-1), []);
      if (items.length === 0) {
        return <ExNotice tone="slate">Chưa có ảnh trang phục có nguồn rõ ràng cho cộng đồng này.</ExNotice>;
      }
      return (
        <div className="space-y-3" data-ex="costume-gallery">
          <div className="font-bold text-slate-900">Thư viện ảnh trang phục {culture.name} ({items.length} ảnh)</div>
          <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
            {items.map((g, i) => (
              <button key={g.id} type="button" onClick={() => setOpen(i)} className="text-left rounded-2xl border border-slate-200 bg-white overflow-hidden hover:shadow-md hover:border-forest-500 transition" data-ex="gallery-photo" data-photo={g.id}>
                <div className="bg-slate-100">
                  <ExImg src={g.src} alt={g.caption} caption={g.caption} className="w-full h-48 sm:h-56 object-contain" />
                </div>
                <div className="p-2.5 space-y-0.5">
                  <div className="font-bold text-slate-900 text-[11px] leading-snug">{g.caption}</div>
                  <div className="text-[10px] text-slate-500">{g.source}</div>
                  <div className="text-[10px] font-bold text-forest-600">Nhấn để phóng to</div>
                </div>
              </button>
            ))}
          </div>
          <ExNotice tone="amber"><span data-ex="gallery-note"><b>{EXPLORE_GALLERY_NOTE}</b> {EXPLORE_GALLERY_GROUP_NOTE[culture.id] || ''} Tác giả và giấy phép từng ảnh xem tại trang tệp Wikimedia Commons (liên kết trong khung phóng to).</span></ExNotice>
          {open >= 0 && <ExLightbox items={items} index={open} onClose={close} onIndex={setOpen} />}
        </div>
      );
    }

    // ---------------- Biểu mẫu "Đăng ký quan tâm trải nghiệm văn hóa" (bản demo) ----------------
    function CultureInterestForm({ culture, setAppData, showToast }) {
      const [f, setF] = useState({ name: '', phone: '', cultureId: culture.id, activity: '', date: '', people: '2', note: '' });
      const [err, setErr] = useState('');
      const [done, setDone] = useState(null);
      const set = (k) => (e) => setF(prev => ({ ...prev, [k]: e.target.value, ...(k === 'cultureId' ? { activity: '' } : {}) }));
      const selCulture = EXPLORE_CULTURES.find(c => c.id === f.cultureId) || culture;
      const OTHER = 'Hoạt động khác (ghi trong nội dung)';
      const STATUS = 'Yêu cầu đã được ghi nhận trong bản demo, chưa được gửi đến đơn vị tổ chức';
      const submit = (e) => {
        e.preventDefault();
        setErr('');
        if (!f.name.trim()) return setErr('Vui lòng nhập họ tên.');
        if (!exValidPhone(f.phone)) return setErr('Số điện thoại chưa hợp lệ (ví dụ: 0912345678 hoặc +84912345678).');
        if (!f.activity) return setErr('Vui lòng chọn hoạt động muốn tìm hiểu.');
        if (!f.date) return setErr('Vui lòng chọn ngày dự kiến tham gia.');
        if (f.date < exToday()) return setErr('Ngày dự kiến không được ở trong quá khứ.');
        const p = Number(f.people);
        if (!Number.isInteger(p) || p < 1 || p > 50) return setErr('Số lượng người phải là số nguyên từ 1 đến 50.');
        if (f.activity === OTHER && f.note.trim().length < 5) return setErr('Bạn chọn hoạt động khác, vui lòng mô tả trong phần nội dung (ít nhất 5 ký tự).');
        const stamp = Date.now();
        const code = 'YC-DEMO-' + String(stamp).slice(-6);
        const record = { id: `req-${stamp}`, code, type: 'interest', serviceId: '', serviceTitle: 'Đăng ký quan tâm trải nghiệm văn hóa', cultureId: selCulture.id, cultureName: selCulture.name, activity: f.activity, date: f.date, people: p, name: f.name.trim(), phone: f.phone.trim(), note: f.note.trim(), isDemo: true, status: STATUS, createdAt: new Date().toISOString() };
        setAppData(prev => ({ ...prev, demoRequests: [record, ...(prev.demoRequests || [])] }));
        setDone({ code, status: STATUS });
        showToast('Đã ghi nhận đăng ký quan tâm (demo) trên trình duyệt này.', 'info');
      };
      if (done) {
        return (
          <div className="space-y-3" data-ex="interest-done">
            <ExNotice tone="blue"><b data-ex="interest-status">{done.status}</b><br />Mã yêu cầu demo: <b data-ex="interest-code">{done.code}</b><br />Yêu cầu chỉ được lưu trên thiết bị/trình duyệt này. Chưa có người dân hoặc đơn vị tổ chức nào nhận được yêu cầu.</ExNotice>
            <button type="button" onClick={() => setDone(null)} className="px-4 py-2 rounded-xl bg-slate-100 font-bold text-xs">Gửi đăng ký khác</button>
          </div>
        );
      }
      return (
        <form onSubmit={submit} className="space-y-3 p-4 rounded-2xl border border-emerald-200 bg-emerald-50/40" data-ex="interest-form">
          <div className="font-extrabold text-slate-900 text-sm">Đăng ký quan tâm trải nghiệm văn hóa</div>
          <ExNotice tone="amber">Bản demo: đăng ký chỉ được lưu trên trình duyệt này, <b>không được gửi</b> tới người dân hoặc đơn vị tổ chức, và chưa phải xác nhận tham gia.</ExNotice>
          {err && <div className="p-2.5 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl font-semibold" data-ex="interest-error">{err}</div>}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">

            <section ref={setRef('exp')} className="space-y-3" data-ex-section="exp">
              <Head n="7">Trải nghiệm dành cho du khách</Head>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">

                  <div key={x.id} className="p-4 rounded-2xl border border-slate-200 space-y-2" data-exp={x.id}>

                ))}
              </div>
            </section>

            <section ref={setRef('actions')} className="space-y-3" data-ex-section="actions">
              <Head n="8">Liên hệ và khám phá thêm</Head>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button type="button" onClick={() => setShowContact(v => !v)} className="py-3 rounded-xl bg-forest-600 text-white font-bold text-xs hover:bg-forest-500" data-ex="contact-organizer">Liên hệ tổ chức trải nghiệm</button>
                <button type="button" onClick={() => goServices('Homestay')} className="py-3 rounded-xl bg-community-600 text-white font-bold text-xs hover:bg-community-500" data-ex="goto-homestay">Xem các homestay hiện có</button>
                <button type="button" onClick={() => goServices('Đặc sản')} className="py-3 rounded-xl bg-amber-500 text-white font-bold text-xs hover:bg-amber-400" data-ex="goto-specialty">Khám phá đặc sản địa phương</button>
                <button type="button" onClick={() => goServices('Ẩm thực')} className="py-3 rounded-xl bg-rose-500 text-white font-bold text-xs hover:bg-rose-400" data-ex="goto-food">Khám phá ẩm thực địa phương</button>

                      ))}

                  )
                  : (
                    <div className="space-y-3">
                      <ExNotice tone="amber"><span data-ex="organizer-notice"><b>Chưa có đơn vị hoặc người cung cấp trải nghiệm được xác nhận</b> cho cộng đồng {culture.name}. Website chưa nhận đặt chỗ và không có thông tin liên hệ được xác minh. Các hoạt động ở trên đều là đề xuất, chỉ được đánh dấu “Có thể đặt trải nghiệm” khi có đơn vị hoặc người dân đồng ý tổ chức. Bạn có thể để lại đăng ký quan tâm bên dưới.</span></ExNotice>
                      <CultureInterestForm culture={culture} setAppData={setAppData} showToast={showToast} />

              <div className="text-[11px] text-slate-500">Các nút trên mở khu “Dịch vụ Homestay & Đặc sản địa phương” với bộ lọc tương ứng. Website chưa có dữ liệu vị trí đáng tin cậy nên không xác định “gần đây” và hiển thị toàn bộ cơ sở trong nhóm.</div>
            </section>
          </div>
        </ExModal>
      );

    // ---------------- Chi tiết điểm đến ----------------

              <div className="text-[11px] font-bold text-forest-600">{dest.category} · {dest.village}</div>

    // ---------------- Bảng thông tin liên hệ (dùng chung homestay / đặc sản / ẩm thực) ----------------
    function ExContactPanel({ serv, kind, onClose, onRequest }) {
      const c = exContact(serv);
      const vs = exVerifyStatus(serv);
      const canCall = exCanCall(serv);
      useEffect(() => {
        // Escape chỉ đóng bảng liên hệ, không đóng luôn cửa sổ chi tiết phía dưới
        const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); onClose(); } };
        document.addEventListener('keydown', onKey, true);
        return () => document.removeEventListener('keydown', onKey, true);
      }, [onClose]);
      const role = c.contactRole || EX_ROLE_FALLBACK[kind] || EX_ROLE_FALLBACK.other;
      const Row = ({ label, children, ex, wide }) => (
        <div className={`p-3 rounded-2xl bg-slate-50 border border-slate-200 ${wide ? 'sm:col-span-2' : ''}`}>
          <div className="text-slate-400">{label}</div>
          <div className="font-bold text-slate-900 break-words" data-ex={ex}>{children}</div>
        </div>
      );
      const reqButtons = kind === 'homestay' ? [['booking', 'Gửi yêu cầu đặt phòng']] : kind === 'product' ? [['purchase', 'Yêu cầu mua hàng']] : kind === 'food' ? [['table', 'Gửi yêu cầu đặt bàn']] : [];
      return (
        <div className="fixed inset-0 z-[80] bg-black/60 overflow-y-auto" onClick={onClose} data-ex="contact-panel">
          <div className="min-h-full flex items-start sm:items-center justify-center p-3 sm:p-6">
            <div onClick={(e) => e.stopPropagation()} className="relative bg-white rounded-3xl shadow-2xl w-full max-w-xl overflow-hidden">
              <ExImg src={serv.image} alt={serv.title} className="w-full h-36 object-cover" />
              <div className="p-6 space-y-4 text-xs text-slate-700 leading-relaxed">
                <div className="space-y-1">
                  <div className="flex flex-wrap gap-1">
                    <span className="px-2 py-0.5 bg-blue-50 text-blue-600 text-[10px] font-bold rounded">{serv.category}</span>
                    <span className={`px-2 py-0.5 text-[10px] font-bold rounded ${vs === 'verified' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}`}>{EX_VERIFY_LABEL[vs]}</span>
                  </div>
                  <h3 className="text-xl font-black text-slate-900" data-ex="contact-title">{kind === 'homestay' ? 'Liên hệ chủ homestay' : kind === 'product' ? 'Liên hệ người bán' : kind === 'food' ? 'Liên hệ quán' : 'Thông tin liên hệ'}: {serv.title}</h3>
                </div>
                {vs === 'demo' && <ExNotice tone="amber"><span data-ex="demo-warning">{EX_DEMO_WARNING}</span></ExNotice>}
                {vs === 'pending' && <ExNotice tone="amber"><span data-ex="demo-warning">{EX_PENDING_WARNING}</span></ExNotice>}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <Row label={kind === 'product' ? 'Người bán / người phụ trách' : 'Người phụ trách'} ex="contact-name">
                    {c.contactName || 'Đang cập nhật'}
                    {c.isDemo === true && <span className="block text-[10px] font-bold text-amber-700">{EX_DEMO_PERSON}</span>}
                  </Row>
                  <Row label="Vai trò" ex="contact-role">{role}</Row>
                  <Row label={kind === 'product' ? 'Khu vực cung cấp' : 'Khu vực hoạt động'} ex="contact-area">{c.address || serv.village}</Row>
                  <Row label="Số điện thoại" ex="contact-info">
                    {canCall
                      ? <a href={exTelHref(c.phone)} className="underline text-emerald-700" data-ex="tel-link">{c.phone}</a>
                      : 'Chưa có số điện thoại liên hệ'}
                  </Row>
                  <Row label="Phương thức liên hệ khả dụng" ex="contact-method">{c.contactMethod || 'Chưa có kênh liên hệ được xác minh'}</Row>
                  <Row label={kind === 'food' ? 'Giờ hoạt động' : 'Giờ liên hệ'} ex="contact-hours">{c.businessHours || 'Chưa có dữ liệu'}</Row>
                  <Row label="Trạng thái xác minh" ex="contact-verify">{EX_VERIFY_LABEL[vs]}</Row>
                  <Row label={kind === 'product' ? 'Giá tham khảo (tên sản phẩm: ' + serv.title + ')' : 'Giá tham khảo'}>{serv.price}</Row>
                  {kind === 'food' && (serv.dishes || []).length > 0 && <Row label="Món tiêu biểu" wide>{serv.dishes.join(', ')}</Row>}
                </div>
                {c.contactNote && <div className="text-[11px] text-slate-500 italic" data-ex="contact-note">{c.contactNote}</div>}
                <div className="flex flex-col sm:flex-row flex-wrap gap-3">
                  {canCall && <a href={exTelHref(c.phone)} className="flex-1 py-3 rounded-xl bg-emerald-600 text-white font-bold text-center hover:bg-emerald-500" data-ex="call-btn">Gọi điện</a>}
                  <button type="button" onClick={() => onRequest('contact')} className="flex-1 py-3 rounded-xl bg-slate-900 text-white font-bold hover:bg-slate-700" data-ex="contact-request-btn">Gửi yêu cầu liên hệ</button>
                  {reqButtons.map(([t, label]) => (
                    <button key={t} type="button" onClick={() => onRequest(t)} className="flex-1 py-3 rounded-xl bg-forest-600 text-white font-bold hover:bg-forest-500" data-ex={'contact-' + t + '-btn'}>{label}</button>
                  ))}
                  <button type="button" onClick={onClose} className="flex-1 py-3 rounded-xl bg-slate-100 text-slate-800 font-bold hover:bg-slate-200" data-ex="contact-close">Đóng</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ---------------- Chi tiết dịch vụ (homestay / đặc sản / ẩm thực / khác) ----------------
    function ServiceModal({ serv, onClose, onBack, toggleWishlist, isSaved, setAppData, showToast, requests }) {
      const kind = exServiceKind(serv);
      const c = exContact(serv);
      const vstatus = exVerifyStatus(serv);
      const simulated = vstatus !== 'verified';
      const [view, setView] = useState('detail'); // detail | form | done
      const [showContact, setShowContact] = useState(false);
      const [showMenu, setShowMenu] = useState(false);
      const [err, setErr] = useState('');
      const [doneStatus, setDoneStatus] = useState('');
      const [doneCode, setDoneCode] = useState('');
      const unit = String(serv.price || '').includes('/') ? String(serv.price).split('/').slice(1).join('/').trim() : '';
      const defaultType = kind === 'homestay' ? 'booking' : kind === 'product' ? 'purchase' : kind === 'food' ? 'table' : 'contact';
      const [f, setF] = useState({ type: defaultType, name: '', phone: '', checkIn: '', checkOut: '', guests: '2', date: '', time: '', note: '', qty: '1', delivery: 'pickup' });
      const set = (k) => (e) => setF(prev => ({ ...prev, [k]: e.target.value }));
      const mine = (requests || []).filter(r => r.serviceId === serv.id);
      const recipient = kind === 'product' ? 'người bán' : kind === 'food' ? 'quán' : 'chủ cơ sở';
      const typeOptions = kind === 'homestay' ? [['booking', 'Đặt phòng'], ['contact', 'Hỏi thông tin / đề nghị chủ cơ sở liên hệ lại']]
        : kind === 'product' ? [['purchase', 'Mua hàng'], ['contact', 'Đề nghị người bán liên hệ lại']]
        : kind === 'food' ? [['table', 'Đặt bàn'], ['contact', 'Hỏi thông tin / đề nghị quán liên hệ lại']]
        : [['contact', 'Đề nghị cơ sở liên hệ lại']];
      const sellerLabel = c.contactName ? c.contactName + (c.isDemo === true ? ' (' + EX_DEMO_PERSON + ')' : '') : (serv.seller || 'Thông tin người bán đang được cập nhật');

      const STATUS = {
        booking: 'Đã ghi nhận yêu cầu demo — chưa gửi tới chủ cơ sở',
        purchase: 'Đã ghi nhận yêu cầu demo — chưa chuyển tới người bán',
        table: 'Đã ghi nhận yêu cầu đặt bàn demo — chưa gửi tới quán',
        contact: 'Đã ghi nhận yêu cầu liên hệ demo — chưa gửi tới cơ sở'
      };
      const openForm = (type) => { setShowContact(false); setF(prev => ({ ...prev, type })); setErr(''); setView('form'); };

      const submit = (e) => {
        e.preventDefault();
        setErr('');
        if (!f.name.trim()) return setErr('Vui lòng nhập họ tên.');
        if (!exValidPhone(f.phone)) return setErr('Số điện thoại chưa hợp lệ (ví dụ: 0912345678 hoặc +84912345678).');
        let req;
        if (f.type === 'booking') {
          const today = exToday();
          if (!f.checkIn || !f.checkOut) return setErr('Vui lòng chọn ngày nhận phòng và ngày trả phòng.');
          if (f.checkIn < today) return setErr('Ngày nhận phòng không được ở trong quá khứ.');
          if (f.checkOut <= f.checkIn) return setErr('Ngày trả phòng phải sau ngày nhận phòng.');
          const g = Number(f.guests);
          if (!Number.isInteger(g) || g < 1 || g > 50) return setErr('Số lượng khách phải là số nguyên từ 1 đến 50.');
          req = { type: 'booking', checkIn: f.checkIn, checkOut: f.checkOut, guests: g };
        } else if (f.type === 'purchase') {
          const q = Number(f.qty);
          if (!Number.isInteger(q) || q < 1 || q > 999) return setErr('Số lượng phải là số nguyên từ 1 đến 999.');
          req = { type: 'purchase', product: serv.title, quantity: q, delivery: f.delivery === 'pickup' ? 'Nhận trực tiếp tại nơi bán' : 'Giao hàng (cần thỏa thuận với người bán)' };
        } else if (f.type === 'table') {
          if (!f.date) return setErr('Vui lòng chọn ngày đặt bàn.');
          if (f.date < exToday()) return setErr('Ngày đặt bàn không được ở trong quá khứ.');
          if (!f.time) return setErr('Vui lòng chọn giờ dự kiến.');
          const g = Number(f.guests);
          if (!Number.isInteger(g) || g < 1 || g > 50) return setErr('Số lượng khách phải là số nguyên từ 1 đến 50.');
          req = { type: 'table', date: f.date, time: f.time, guests: g };
        } else {
          if (f.note.trim().length < 5) return setErr('Vui lòng nhập nội dung yêu cầu (ít nhất 5 ký tự).');
          req = { type: 'contact' };
        }
        req.status = STATUS[req.type];
        const stamp = Date.now();
        const code = 'YC-DEMO-' + String(stamp).slice(-6);
        const record = { id: `req-${stamp}`, code, serviceId: serv.id, serviceTitle: serv.title, category: serv.category, village: serv.village, name: f.name.trim(), phone: f.phone.trim(), note: f.note.trim(), isDemo: simulated, createdAt: new Date().toISOString(), ...req };
        setAppData(prev => ({ ...prev, demoRequests: [record, ...(prev.demoRequests || [])] }));
        setDoneStatus(req.status);
        setDoneCode(code);
        setView('done');
        showToast('Đã ghi nhận yêu cầu demo trên trình duyệt này.', 'info');
      };

      const noteLabel = f.type === 'contact' ? 'Nội dung yêu cầu *' : (f.type === 'booking' ? 'Yêu cầu bổ sung' : 'Ghi chú');
      const menu = Array.isArray(serv.menu) ? serv.menu : [];

      return (
        <>
        <ExModal onClose={onClose} onBack={onBack} testId="service-modal">
          <ExImg src={serv.image} alt={serv.title} className="w-full h-52 object-cover" />
          <div className="px-6 pt-1 text-[10px] text-slate-400">{vstatus === 'verified' ? 'Ảnh do cơ sở cung cấp.' : 'Ảnh minh họa, chưa phải ảnh thực tế của cơ sở.'}</div>
          <div className="p-6 space-y-4 text-xs text-slate-700 leading-relaxed">
            <div className="space-y-1">
              <div className="flex flex-wrap gap-1">
                <span className="px-2 py-0.5 bg-blue-50 text-blue-600 text-[10px] font-bold rounded">{serv.category}</span>
                {simulated && <span className="px-2 py-0.5 bg-amber-50 text-amber-700 text-[10px] font-bold rounded">{EX_VERIFY_LABEL[vstatus]}</span>}
                {serv.needsReview && <span className="px-2 py-0.5 bg-rose-50 text-rose-700 text-[10px] font-bold rounded">Cần đối chiếu thôn</span>}
              </div>
              <h2 className="text-2xl font-black text-slate-900" data-ex="service-title">{serv.title}</h2>
              <div className="text-slate-500">{kind === 'product' ? 'Khu vực cung cấp' : 'Thôn / địa điểm'}: {serv.village}</div>
            </div>

            {view === 'detail' && (
              <>
                <p>{serv.description}</p>
                {simulated && <ExNotice tone="amber">{kind === 'product' ? <>Dữ liệu mô phỏng — chưa xác minh người bán và giá bán. Giá, mô tả và liên hệ của mục này chưa được cơ sở hoặc địa phương xác minh.</> : <>Thông tin giá, mô tả và liên hệ của mục này là <b>dữ liệu mô phỏng</b>, chưa được cơ sở hoặc địa phương xác minh{kind === 'food' ? '; chưa xác nhận đây là cơ sở kinh doanh đang hoạt động' : ''}.</>}</ExNotice>}

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200">
                    <div className="text-slate-400">{kind === 'product' ? 'Giá bán' : 'Giá tham khảo'}</div>
                    <div className="font-extrabold text-forest-600 text-sm" data-ex="price">{serv.price}</div>
                    <div className="text-slate-500">{serv.priceVerified === true ? 'Giá đã được xác minh' : 'Giá chưa xác minh, chưa có ngày cập nhật'}</div>
                  </div>
                  <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200">
                    <div className="text-slate-400">{kind === 'product' ? 'Đơn vị bán' : 'Đơn vị tính'}</div>
                    <div className="font-bold text-slate-900">{unit || 'Đang cập nhật'}</div>
                  </div>
                  {kind === 'homestay' && (
                    <>
                      <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200"><div className="text-slate-400">Số khách có thể phục vụ</div><div className="font-bold text-slate-900">{serv.capacity ? `${serv.capacity} khách` : 'Đang cập nhật'}</div></div>
                      <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200"><div className="text-slate-400">Tiện ích</div><div className="font-bold text-slate-900">{(serv.amenities || []).length ? serv.amenities.join(', ') : 'Đang cập nhật'}</div></div>
                      <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200 sm:col-span-2"><div className="text-slate-400">Quy định lưu trú</div><div className="font-bold text-slate-900">{serv.rules || 'Đang cập nhật'}</div></div>
                    </>
                  )}
                  {kind === 'product' && (
                    <>
                      <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200"><div className="text-slate-400">Quy cách đóng gói</div><div className="font-bold text-slate-900">{serv.packaging || 'Đang cập nhật'}</div></div>
                      <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200"><div className="text-slate-400">Nguồn gốc</div><div className="font-bold text-slate-900">{serv.origin || `${serv.village} (theo mô tả; cần xác minh)`}</div></div>
                      <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200 sm:col-span-2"><div className="text-slate-400">Cơ sở / người bán</div><div className="font-bold text-slate-900" data-ex="seller">{sellerLabel}</div></div>
                    </>
                  )}
                  {kind === 'food' && (
                    <>
                      <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200 sm:col-span-2"><div className="text-slate-400">Món tiêu biểu</div><div className="font-bold text-slate-900">{(serv.dishes || []).length ? serv.dishes.join(', ') : 'Đang cập nhật'}</div></div>
                      <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200"><div className="text-slate-400">Người phụ trách</div><div className="font-bold text-slate-900" data-ex="seller">{sellerLabel}</div></div>
                      <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200"><div className="text-slate-400">Giờ hoạt động</div><div className="font-bold text-slate-900">{c.businessHours || 'Chưa có dữ liệu giờ hoạt động'}</div></div>
                    </>
                  )}
                  {kind === 'other' && <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200 sm:col-span-2"><div className="text-slate-400">Hình thức đặt</div><div className="font-bold text-slate-900">Website chưa hỗ trợ đặt chỗ trực tuyến cho loại dịch vụ này.</div></div>}
                </div>

                {kind === 'food' && showMenu && (
                  <div className="p-4 rounded-2xl border border-slate-200 space-y-2" data-ex="menu">
                    <div className="font-extrabold text-slate-900 text-sm">Thực đơn tham khảo</div>
                    {menu.length === 0
                      ? <div className="text-slate-500 italic">Thực đơn đang được cập nhật.</div>
                      : <ul className="divide-y">{menu.map(m => <li key={m.name} className="py-1.5 flex justify-between gap-3"><span>{m.name}</span><span className="font-bold text-forest-600 whitespace-nowrap">{m.price}</span></li>)}</ul>}
                    <div className="text-[10px] text-amber-700 font-semibold">{simulated ? 'Thực đơn và giá mô phỏng, chưa xác minh với cơ sở.' : 'Thực đơn và giá có thể thay đổi, vui lòng liên hệ cơ sở để xác nhận.'}</div>
                  </div>
                )}

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {kind === 'food' && <button type="button" onClick={() => setShowMenu(v => !v)} className="py-3 rounded-xl bg-amber-500 text-white font-bold hover:bg-amber-400" data-ex="menu-btn">{showMenu ? 'Ẩn thực đơn' : 'Xem thực đơn'}</button>}
                  <button type="button" onClick={() => setShowContact(true)} className="py-3 rounded-xl bg-slate-900 text-white font-bold hover:bg-slate-700" data-ex="contact-btn">{kind === 'homestay' ? 'Liên hệ chủ homestay' : kind === 'product' ? 'Liên hệ người bán' : kind === 'food' ? 'Liên hệ quán' : 'Thông tin liên hệ'}</button>
                  {kind !== 'other' && <button type="button" onClick={() => openForm(defaultType)} className="py-3 rounded-xl bg-forest-600 text-white font-bold hover:bg-forest-500" data-ex="request-btn">{kind === 'homestay' ? 'Gửi yêu cầu đặt phòng' : kind === 'product' ? 'Yêu cầu mua hàng' : 'Gửi yêu cầu đặt bàn'}</button>}
                  <button type="button" onClick={() => toggleWishlist(serv.id)} className={`py-3 rounded-xl font-bold ${isSaved ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-800 hover:bg-slate-200'}`} data-ex="save-service">{isSaved ? 'Đã lưu — bấm để bỏ' : (kind === 'product' ? 'Lưu sản phẩm' : 'Lưu địa điểm')}</button>
                </div>
                {mine.length > 0 && <ExNotice tone="blue"><b>Yêu cầu demo của bạn cho mục này:</b> {mine.length} yêu cầu đã ghi nhận trên trình duyệt này (chưa gửi cho ai).</ExNotice>}
              </>
            )}

            {view === 'form' && (
              <form onSubmit={submit} className="space-y-3 p-4 rounded-2xl border border-emerald-200 bg-emerald-50/40" data-ex="request-form">
                <div className="font-extrabold text-slate-900 text-sm">Biểu mẫu yêu cầu (demo)</div>
                <ExNotice tone="amber">Đây là bản demo: yêu cầu chỉ được lưu trên trình duyệt này, <b>không được gửi</b> tới {recipient} và chưa phải xác nhận {f.type === 'booking' ? 'đặt phòng' : f.type === 'purchase' ? 'đơn hàng' : f.type === 'table' ? 'đặt bàn' : 'liên hệ'}.</ExNotice>
                {err && <div className="p-2.5 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl font-semibold" data-ex="form-error">{err}</div>}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div><label className="block font-bold mb-1">Họ tên người liên hệ *</label><input type="text" value={f.name} onChange={set('name')} className={EX_INPUT} data-ex="f-name" /></div>
                  <div><label className="block font-bold mb-1">Số điện thoại của bạn *</label><input type="tel" value={f.phone} onChange={set('phone')} className={EX_INPUT} placeholder="0912345678" data-ex="f-phone" /></div>
                  <div><label className="block font-bold mb-1">Loại yêu cầu</label>
                    <select value={f.type} onChange={set('type')} className={EX_INPUT} data-ex="f-type">
                      {typeOptions.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                    </select>
                  </div>
                  <div><label className="block font-bold mb-1">{kind === 'product' ? 'Sản phẩm cần liên hệ' : 'Cơ sở cần liên hệ'}</label><input type="text" value={serv.title} readOnly className={`${EX_INPUT} bg-slate-100`} data-ex="f-product" /></div>
                  {f.type === 'booking' && (
                    <>
                      <div><label className="block font-bold mb-1">Ngày nhận phòng *</label><input type="date" min={exToday()} value={f.checkIn} onChange={set('checkIn')} className={EX_INPUT} data-ex="f-checkin" /></div>
                      <div><label className="block font-bold mb-1">Ngày trả phòng *</label><input type="date" min={f.checkIn || exToday()} value={f.checkOut} onChange={set('checkOut')} className={EX_INPUT} data-ex="f-checkout" /></div>
                      <div><label className="block font-bold mb-1">Số lượng khách *</label><input type="number" min="1" max="50" value={f.guests} onChange={set('guests')} className={EX_INPUT} data-ex="f-guests" /></div>
                    </>
                  )}
                  {f.type === 'purchase' && (
                    <>
                      <div><label className="block font-bold mb-1">Số lượng *</label><input type="number" min="1" max="999" value={f.qty} onChange={set('qty')} className={EX_INPUT} data-ex="f-qty" /></div>
                      <div><label className="block font-bold mb-1">Hình thức nhận hàng</label>
                        <select value={f.delivery} onChange={set('delivery')} className={EX_INPUT} data-ex="f-delivery">
                          <option value="pickup">Nhận trực tiếp tại nơi bán</option>
                          <option value="ship">Giao hàng (cần thỏa thuận với người bán)</option>
                        </select>
                      </div>
                    </>
                  )}
                  {f.type === 'table' && (
                    <>
                      <div><label className="block font-bold mb-1">Ngày đặt bàn *</label><input type="date" min={exToday()} value={f.date} onChange={set('date')} className={EX_INPUT} data-ex="f-date" /></div>
                      <div><label className="block font-bold mb-1">Giờ dự kiến *</label><input type="time" value={f.time} onChange={set('time')} className={EX_INPUT} data-ex="f-time" /></div>
                      <div><label className="block font-bold mb-1">Số lượng khách *</label><input type="number" min="1" max="50" value={f.guests} onChange={set('guests')} className={EX_INPUT} data-ex="f-guests" /></div>
                    </>
                  )}
                </div>
                <div><label className="block font-bold mb-1">{noteLabel}</label><textarea rows="2" value={f.note} onChange={set('note')} className={EX_INPUT} data-ex="f-note"></textarea></div>
                <div className="text-[10px] text-slate-500">Họ tên và số điện thoại chỉ lưu trong trình duyệt của bạn, không gửi ra ngoài.</div>
                <div className="flex justify-end gap-2">
                  <button type="button" onClick={() => setView('detail')} className="px-4 py-2 rounded-xl bg-slate-100 font-bold">Quay lại</button>
                  <button type="submit" className="px-5 py-2 rounded-xl bg-forest-600 text-white font-bold hover:bg-forest-500" data-ex="submit-request">Ghi nhận yêu cầu demo</button>
                </div>
              </form>
            )}

            {view === 'done' && (
              <div className="space-y-3" data-ex="request-done">
                <ExNotice tone="blue"><b data-ex="request-status">{doneStatus}</b><br />Mã yêu cầu demo: <b data-ex="request-code">{doneCode}</b><br />Yêu cầu chỉ được lưu trên thiết bị/trình duyệt này. Chưa có {recipient} nào nhận được yêu cầu, và đây không phải xác nhận {f.type === 'booking' ? 'đặt phòng' : f.type === 'purchase' ? 'đơn hàng' : f.type === 'table' ? 'đặt bàn' : 'liên hệ'}.</ExNotice>
                <div className="flex flex-wrap gap-2">
                  <button type="button" onClick={() => setShowContact(true)} className="px-4 py-2 rounded-xl bg-slate-900 text-white font-bold">Xem thông tin liên hệ</button>
                  <button type="button" onClick={() => setView('detail')} className="px-4 py-2 rounded-xl bg-slate-100 font-bold">Quay lại chi tiết</button>
                </div>
              </div>
            )}
          </div>
        </ExModal>
        {showContact && <ExContactPanel serv={serv} kind={kind} onClose={() => setShowContact(false)} onRequest={openForm} />}
        </>
      );
    }

    // ---------------- Thẻ & chi tiết trải nghiệm theo mùa ----------------
    function SeasonCard({ season, current, onOpen }) {
      return (
        <div className="ex-sc flex flex-col" data-season={season.id}>
          <div className="ex-sc-media relative overflow-hidden">
            <ExImg src={season.image} alt={season.title} caption={season.period} className="w-full h-full object-cover" />
            {current && <span className="ex-sc-badge">Đang trong mùa này</span>}
          </div>
          <div className="ex-sc-body flex-1 flex flex-col justify-between">
            <div>
              <div className="ex-sc-period">{season.period}</div>
              <h3 className="ex-sc-title">{season.title}</h3>
              <p className="ex-sc-desc">{season.desc}</p>
              <ul className="ex-sc-list">
                {season.activities.slice(0, 4).map(a => <li key={a.name}>{a.name}</li>)}
              </ul>
            </div>
            <button type="button" onClick={() => onOpen(season.id)} className="ex-btn w-full" data-ex="open-season">Khám phá trải nghiệm</button>
          </div>
        </div>
      );
    }

    function SeasonModal({ season, onClose, onBack, appData, openService, openDestination, openCulture }) {
      const destinations = season.destinationIds.map(id => (appData.destinations || []).find(d => d.id === id && d.status === 'published')).filter(Boolean);
      const services = (appData.services || []).filter(s => s.status === 'published' && season.serviceCategories.includes(s.category));
      const events = (appData.events || []).filter(ev => {
        if (ev.status !== 'published' || !ev.start) return false;
        const sm = Number(String(ev.start).slice(5, 7));
        const em = Number(String(ev.end || ev.start).slice(5, 7));
        return season.months.some(m => m === sm || m === em);
      });
      const cultures = season.cultureIds.map(id => EXPLORE_CULTURES.find(c => c.id === id)).filter(Boolean);
      return (
        <ExModal onClose={onClose} onBack={onBack} testId="season-modal">
          <div className="relative h-48">
            <ExImg src={season.image} alt={season.title} caption={season.period} className="w-full h-full object-cover" />
            <div className="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>
            <div className="absolute bottom-4 left-5 right-5 text-white">
              <div className="text-xs font-bold text-emerald-300">{season.period}</div>
              <h2 className="text-2xl font-black" data-ex="season-title">{season.title}</h2>
            </div>
          </div>
          <div className="p-6 space-y-5 text-xs text-slate-700 leading-relaxed">
            <p className="text-sm">{season.desc}</p>

            <div className="space-y-2">
              <h3 className="font-extrabold text-slate-900 text-sm">Hoạt động gợi ý</h3>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {season.activities.map(a => <div key={a.name} className="p-3 rounded-2xl border border-slate-200"><div className="font-bold text-slate-900">{a.name}</div><div>{a.text}</div></div>)}
              </div>
            </div>

            <ExNotice tone="blue"><b>Lưu ý thời tiết:</b> {season.weather} Đây là thông tin chung, không phải dự báo.</ExNotice>
            <ExNotice tone="amber"><b>Lưu ý xác minh:</b> {season.note}</ExNotice>

            {events.length > 0 && (
              <div className="space-y-2" data-ex="season-events">
                <h3 className="font-extrabold text-slate-900 text-sm">Sự kiện trong dữ liệu website</h3>
                {events.map(ev => <div key={ev.id} className="p-3 rounded-2xl border border-slate-200"><div className="font-bold text-slate-900">{ev.title}</div><div className="text-slate-500">{exFmtDate(ev.start)} – {exFmtDate(ev.end)} · {ev.location || 'Địa điểm đang cập nhật'}</div></div>)}
                <div className="text-[11px] text-slate-500 italic">Chỉ là thông tin trong dữ liệu sự kiện hiện có; cần xác nhận lịch và đơn vị tổ chức từng năm.</div>
              </div>
            )}

            {destinations.length > 0 && (
              <div className="space-y-2" data-ex="season-destinations">
                <h3 className="font-extrabold text-slate-900 text-sm">Điểm đến liên quan</h3>
                <div className="flex flex-wrap gap-2">
                  {destinations.map(d => <button key={d.id} type="button" onClick={() => openDestination(d.id)} className="px-3 py-2 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 font-bold hover:bg-emerald-100" data-ex="season-dest">{d.title}</button>)}
                </div>
              </div>
            )}

            {cultures.length > 0 && (
              <div className="space-y-2">
                <h3 className="font-extrabold text-slate-900 text-sm">Tìm hiểu văn hóa</h3>
                <div className="flex flex-wrap gap-2">
                  {cultures.map(c => <button key={c.id} type="button" onClick={() => openCulture(c.id)} className="px-3 py-2 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 font-bold hover:bg-rose-100" data-ex="season-culture">Văn hóa {c.name}</button>)}
                </div>
              </div>
            )}

            <div className="space-y-2" data-ex="season-services">
              <h3 className="font-extrabold text-slate-900 text-sm">Homestay, đặc sản và dịch vụ phù hợp</h3>
              {services.length === 0
                ? <div className="text-slate-500 italic">Chưa có dịch vụ phù hợp được đăng trên website.</div>
                : <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">{services.map(s => (
                    <button key={s.id} type="button" onClick={() => openService(s.id)} className="text-left p-3 rounded-2xl border border-slate-200 hover:border-forest-500 hover:bg-slate-50" data-ex="season-service">
                      <div className="text-[10px] font-bold text-blue-600">{s.category}</div>
                      <div className="font-bold text-slate-900">{s.title}</div>
                      <div className="text-slate-500">{s.village} · {s.price}</div>
                    </button>))}</div>}
            </div>
          </div>
        </ExModal>
      );
    }

    // --- BẢN ĐỒ GOOGLE MAPS NHÚNG (khu vực xã Hồng Thái) ---
    // Dùng iframe nhúng không cần API key. Để đặt lại tâm bản đồ, sửa HONG_THAI_MAP.query
    // (nên ghi đủ xã, huyện, tỉnh để không nhầm với địa danh Hồng Thái ở nơi khác) hoặc dùng "vĩ độ,kinh độ".
    const HONG_THAI_MAP = { query: 'Xã Hồng Thái, Na Hang, Tuyên Quang, Việt Nam', zoom: 12 };
    function hongThaiEmbedUrl(type) {
      return 'https://www.google.com/maps?q=' + encodeURIComponent(HONG_THAI_MAP.query) + '&z=' + HONG_THAI_MAP.zoom + '&t=' + (type === 'k' ? 'k' : 'm') + '&hl=vi&output=embed';
    }
    function hongThaiOpenUrl() {
      return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(HONG_THAI_MAP.query);
    }

    function ExploreView({ appData, setAppData, showToast, toggleWishlist, wishlist, setActiveTab, setIsAiChatOpen }) {
      const [filterCategory, setFilterCategory] = useState('all');
      const [searchTerm, setSearchTerm] = useState('');
      const [serviceFilter, setServiceFilter] = useState('all');
      const [stack, setStack] = useState([]); // ngăn xếp cửa sổ chi tiết: { type, id }
      const servicesRef = useRef(null);
      const [mapType, setMapType] = useState('m'); // 'm' = bản đồ đường phố, 'k' = vệ tinh

      const filteredDestinations = useMemo(() => {
        return appData.destinations.filter(item => {
          if (item.status !== 'published') return false;
          const matchCat = filterCategory === 'all' || item.category === filterCategory;
          const matchSearch = item.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              item.description.toLowerCase().includes(searchTerm.toLowerCase());
          return matchCat && matchSearch;
        });
      }, [appData.destinations, filterCategory, searchTerm]);

      const publishedServices = (appData.services || []).filter(s => s.status === 'published');
      const serviceCategories = Array.from(new Set(publishedServices.map(s => s.category)));
      const kw = searchTerm.trim().toLowerCase();
      const filteredServices = publishedServices.filter(s =>
        (serviceFilter === 'all' || s.category === serviceFilter) &&
        (!kw || `${s.title} ${s.description} ${s.village} ${s.category}`.toLowerCase().includes(kw))
      );
      const currentMonth = new Date().getMonth() + 1;

      const push = (type, id) => setStack(prev => [...prev, { type, id }]);
      const pop = () => setStack(prev => prev.slice(0, -1));
      const closeAll = () => setStack([]);
      const top = stack.length ? stack[stack.length - 1] : null;
      const back = stack.length > 1 ? pop : null;

      // Đi tới khu dịch vụ với bộ lọc loại dịch vụ
      const goServices = (category) => {
        const exists = publishedServices.some(s => s.category === category);
        closeAll();
        setServiceFilter(exists ? category : 'all');
        showToast(exists
          ? (category === 'Homestay' ? 'Đang hiển thị các homestay hiện có (chưa có dữ liệu vị trí để xác định "gần đây").' : `Đang hiển thị các dịch vụ thuộc nhóm "${category}".`)
          : `Chưa có dịch vụ nhóm "${category}" được đăng trên website.`, 'info');
        setTimeout(() => { if (servicesRef.current && servicesRef.current.scrollIntoView) servicesRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
      };

      const renderModal = () => {
        if (!top) return null;
        if (top.type === 'culture') {
          const c = EXPLORE_CULTURES.find(x => x.id === top.id);
          return c ? <CultureModal culture={c} onClose={closeAll} onBack={back} services={publishedServices} goServices={goServices} setAppData={setAppData} showToast={showToast} /> : null;
        }
        if (top.type === 'season') {
          const s = EXPLORE_SEASONS.find(x => x.id === top.id);
          return s ? <SeasonModal season={s} appData={appData} onClose={closeAll} onBack={back}
            openService={(id) => push('service', id)} openDestination={(id) => push('destination', id)} openCulture={(id) => push('culture', id)} /> : null;
        }
        if (top.type === 'destination') {
          const d = (appData.destinations || []).find(x => x.id === top.id);
          return d ? <DestinationModal dest={d} onClose={closeAll} onBack={back} toggleWishlist={toggleWishlist} isSaved={wishlist.includes(d.id)} /> : null;
        }
        if (top.type === 'service') {
          const s = (appData.services || []).find(x => x.id === top.id);
          return s ? <ServiceModal key={s.id} serv={s} onClose={closeAll} onBack={back} toggleWishlist={toggleWishlist} isSaved={wishlist.includes(s.id)}
            setAppData={setAppData} showToast={showToast} requests={appData.demoRequests} /> : null;
        }
        return null;
      };

      return (
        <div className="space-y-10 pb-16">
          <section className="relative bg-forest-700 text-white py-16 px-4">
            <img
              src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1600&q=80"
              className="absolute inset-0 w-full h-full object-cover opacity-25"
              alt="Khám phá Hồng Thái"
            />
            <div className="relative max-w-4xl mx-auto text-center space-y-4">
              <span className="ex-hero-eyebrow uppercase">KHÁM PHÁ HỒNG THÁI</span>
              <h1 className="ex-hero-title">Vùng đất bình yên với những sắc màu bản địa</h1>
              <p className="ex-hero-desc text-sm sm:text-base mx-auto">
                Hồng Thái – nơi thiên nhiên, văn hóa và con người cùng tạo nên những trải nghiệm đáng nhớ.
              </p>

              <div className="pt-4 max-w-2xl mx-auto space-y-3">
                <div className="relative flex items-center">
                  <i data-lucide="search" className="absolute left-4 w-5 h-5 text-slate-400"></i>
                  <input
                    type="text"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    placeholder="Tìm kiếm điểm đến, dịch vụ, homestay, đặc sản..."
                    className="w-full pl-12 pr-28 py-3.5 rounded-2xl bg-white text-slate-800 placeholder-slate-400 shadow-xl focus:outline-none focus:ring-2 focus:ring-emerald-400 font-medium text-sm"
                  />
                  <button className="absolute right-2 px-5 py-2 rounded-xl bg-forest-600 text-white font-bold text-xs hover:bg-forest-500 transition">
                    Tìm kiếm
                  </button>
                </div>

                <button
                  onClick={() => setIsAiChatOpen(true)}
                  className="inline-flex items-center gap-2 px-4 py-2 bg-amber-400/20 backdrop-blur-md border border-amber-300/40 text-amber-200 rounded-full text-xs font-bold hover:bg-amber-400/30 transition shadow"
                >
                  <i data-lucide="sparkles" className="w-4 h-4 text-amber-300"></i>
                  <span>Mở Chat AI Trợ Lý Du Lịch Lập Lịch Trình Tự Động</span>
                </button>
              </div>
            </div>
          </section>

          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
            <div className="space-y-6">
              <div className="flex items-start justify-between gap-4">
                <h2 className="ex-sec-title">Điểm đến tiêu biểu</h2>
                <span className="ex-sec-count">Hiển thị {filteredDestinations.length} địa điểm đã kiểm duyệt</span>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                {filteredDestinations.map(item => (
                  <DestinationCard
                    key={item.id}
                    item={item}
                    toggleWishlist={toggleWishlist}
                    isSaved={wishlist.includes(item.id)}
                    onClick={() => push('destination', item.id)}
                  />
                ))}
              </div>
            </div>

            {/* TRẢI NGHIỆM VĂN HÓA BẢN ĐỊA */}
            <section className="space-y-8 pt-10" data-ex-section="cultures">
              <div className="ex-sec-head">
                <h2 className="ex-sec-title">Trải nghiệm văn hóa bản địa</h2>
                <p className="ex-sec-lead">Khám phá bản sắc văn hóa, trang phục truyền thống, phong tục, lễ hội và đời sống của các cộng đồng dân tộc tại vùng cao Hồng Thái.</p>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                {EXPLORE_CULTURES.map(c => <CultureCard key={c.id} culture={c} onOpen={(id) => push('culture', id)} />)}
              </div>
              <div className="ex-note">Nội dung ở mức giới thiệu tổng quan. Cần xác minh cộng đồng nào hiện diện tại địa phương và hoạt động nào có thể tổ chức thực tế trước khi quảng bá thành trải nghiệm du lịch.</div>
            </section>

            <div className="grid grid-cols-1 gap-8 pt-4">
              <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                <div className="flex items-center justify-between">
                  <div>
                    <h3 className="text-lg font-bold">Bản đồ khám phá địa phương</h3>
                    <p className="text-xs text-slate-500">Định vị các điểm tham quan, homestay, nhà văn hóa tại Hồng Thái</p>
                  </div>
                  <span className="px-2.5 py-1 bg-emerald-50 text-emerald-700 text-xs font-bold rounded-lg border border-emerald-200">Bản đồ tương tác</span>
                </div>

                <div className="relative w-full h-[320px] sm:h-[400px] bg-slate-100 rounded-2xl overflow-hidden border border-slate-200" data-ex="hongthai-map">
                  <iframe
                    key={mapType}
                    title="Bản đồ khu vực xã Hồng Thái, Tuyên Quang (Google Maps)"
                    src={hongThaiEmbedUrl(mapType)}
                    className="absolute inset-0 w-full h-full border-0"
                    loading="lazy"
                    allowFullScreen
                    referrerPolicy="no-referrer-when-downgrade"
                  ></iframe>
                </div>
                <div className="flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500">
                  <span className="italic">Bản đồ do Google Maps cung cấp, hiển thị khu vực xã Hồng Thái; chưa ghim điểm đến và không vẽ ranh giới hành chính của xã.</span>
                  <span className="flex items-center gap-3">
                    <button type="button" onClick={() => setMapType('m')} data-ex="map-roadmap" className={`font-semibold ${mapType === 'm' ? 'text-forest-600 underline' : 'text-slate-500 hover:text-slate-800'}`}>Bản đồ</button>
                    <button type="button" onClick={() => setMapType('k')} data-ex="map-satellite" className={`font-semibold ${mapType === 'k' ? 'text-forest-600 underline' : 'text-slate-500 hover:text-slate-800'}`}>Vệ tinh</button>
                    <a href={hongThaiOpenUrl()} target="_blank" rel="noopener noreferrer" data-ex="map-open" className="font-semibold text-forest-600 hover:underline">Mở trong Google Maps</a>
                  </span>
                </div>
              </div>
            </div>

            {/* TRẢI NGHIỆM THEO MÙA */}
            <section className="space-y-8 pt-10" data-ex-section="seasons">
              <div className="ex-sec-head">
                <h2 className="ex-sec-title">Trải nghiệm theo mùa</h2>
                <p className="ex-sec-lead">Khám phá Hồng Thái vào nhiều thời điểm trong năm. Thời gian là tham khảo, có thể thay đổi theo thời tiết và mùa vụ từng năm.</p>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-5">
                {EXPLORE_SEASONS.map(s => <SeasonCard key={s.id} season={s} current={s.months.includes(currentMonth)} onOpen={(id) => push('season', id)} />)}
              </div>
            </section>

            {/* DỊCH VỤ HOMESTAY & ĐẶC SẢN */}
            <div className="space-y-8 pt-10" ref={servicesRef} data-ex-section="services">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <h2 className="ex-sec-title ex-sv-sec-title">Dịch vụ Homestay & Đặc sản địa phương</h2>
                <div className="flex flex-wrap gap-2" data-ex="service-filters">
                  {['all', ...serviceCategories].map(c => (
                    <button key={c} type="button" onClick={() => setServiceFilter(c)} data-ex="service-filter" aria-pressed={serviceFilter === c}
                      className={`ex-filter ${serviceFilter === c ? 'is-on' : ''}`}>
                      {c === 'all' ? 'Tất cả' : c}
                    </button>
                  ))}
                </div>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                {filteredServices.map(serv => <ServiceCard key={serv.id} serv={serv} onOpen={(id) => push('service', id)} />)}
                {filteredServices.length === 0 && <div className="sm:col-span-2 lg:col-span-3 ex-note">Không có dịch vụ phù hợp bộ lọc hoặc từ khóa hiện tại.</div>}
              </div>
              {(appData.demoRequests || []).length > 0 && (
                <details className="bg-white rounded-2xl border border-slate-200 p-4 text-xs" data-ex="my-requests">
                  <summary className="cursor-pointer font-bold text-slate-700">Yêu cầu demo đã ghi nhận trên trình duyệt này ({(appData.demoRequests || []).length})</summary>
                  <div className="pt-3 space-y-2">
                    {(appData.demoRequests || []).slice(0, 10).map(r => (
                      <div key={r.id} className="p-3 rounded-xl border border-slate-200 space-y-0.5">
                        <div className="font-bold text-slate-900">{({ booking: 'Yêu cầu đặt phòng', purchase: 'Yêu cầu mua hàng', table: 'Yêu cầu đặt bàn', contact: 'Yêu cầu liên hệ', interest: 'Đăng ký quan tâm' })[r.type] || 'Yêu cầu'}: {r.serviceTitle}</div>
                        <div className="text-slate-500">{r.type === 'booking' ? `${exFmtDate(r.checkIn)} → ${exFmtDate(r.checkOut)} · ${r.guests} khách` : r.type === 'purchase' ? `Số lượng ${r.quantity} · ${r.delivery}` : r.type === 'table' ? `${exFmtDate(r.date)} lúc ${r.time} · ${r.guests} khách` : r.type === 'interest' ? `Văn hóa ${r.cultureName} · ${r.activity} · ${exFmtDate(r.date)} · ${r.people} người` : (r.note || '')}{r.code ? ` · Mã ${r.code}` : ''}</div>
                        <div className="text-amber-700 font-semibold">{r.status}</div>
                      </div>
                    ))}
                    <div className="text-[11px] text-slate-500 italic">Chưa có yêu cầu nào được gửi tới chủ cơ sở hoặc người bán.</div>
                  </div>
                </details>
              )}
              <div className="ex-note">Các thông tin giá, mô tả và liên hệ chưa có dấu xác minh đều là dữ liệu mô phỏng.</div>
            </div>
          </div>

          {renderModal()}
        </div>
      );
    }

    // --- VIEW 3: COMMUNITY SPACE & VILLAGE PROFILES ---
    function CommunityView({ appData, setAppData, userRole, handleRoleSwitch, showToast, addLog }) {
      const [selectedVillageId, setSelectedVillageId] = useState('v-khautrang');
      const [fbTitle, setFbTitle] = useState('');
      const [fbSender, setFbSender] = useState('');

      const [showContributeModal, setShowContributeModal] = useState(false);
      const [contributeTitle, setContributeTitle] = useState('');
      const [contributeDesc, setContributeDesc] = useState('');
      const [contributeCategory, setContributeCategory] = useState('Thông báo');

      const currentVillage = useMemo(() => {
        if (!appData || !appData.villageDetails) return INITIAL_DATA.villageDetails[0];
        return appData.villageDetails.find(v => v.id === selectedVillageId) || appData.villageDetails[0];
      }, [appData, selectedVillageId]);

      const submitFeedback = (e) => {
        e.preventDefault();
        if (!fbTitle || !fbSender) return;

        const newFb = {
          id: `fb-${Date.now()}`,
          sender: fbSender,
          title: fbTitle,
          date: new Date().toLocaleDateString('vi-VN'),
          status: 'Mới tiếp nhận',
          response: 'BQL Thôn đang ghi nhận và tiến hành xử lý.'
        };

        setAppData(prev => ({
          ...prev,
          villageDetails: (prev.villageDetails || []).map(v => {
            if (v.id === selectedVillageId) {
              return { ...v, feedbacks: [newFb, ...(v.feedbacks || [])] };
            }
            return v;
          })
        }));

        setFbTitle('');
        setFbSender('');
        showToast('Đã gửi phản ánh tới BQL Thôn thành công!');
        addLog(`Gửi phản ánh dân sinh: ${fbTitle}`, 'Góp ý và phản ánh');
      };

      const submitContribution = (e) => {
        e.preventDefault();
        if (!contributeTitle || !contributeDesc) return;

        const newItem = {
          id: `pend-${Date.now()}`,
          type: contributeCategory === 'Văn hóa' ? 'cultural' : 'notice',
          title: contributeTitle,
          category: contributeCategory,
          village: currentVillage.name,
          author: 'Bà con nhân dân',
          date: new Date().toLocaleString('vi-VN'),
          description: contributeDesc,
          status: 'pending'
        };

        setAppData(prev => ({
          ...prev,
          pendingItems: [newItem, ...(prev.pendingItems || [])]
        }));

        setContributeTitle('');
        setContributeDesc('');
        setShowContributeModal(false);
        showToast('Đã gửi nội dung cần kiểm duyệt tới Ban Quản Trị xã!');
        addLog(`Gửi đóng góp chờ duyệt: ${contributeTitle}`, 'Trung tâm kiểm duyệt');
      };

      return (
        <div className="vp-page max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
          <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <aside className="lg:col-span-1 vp-side" data-vp="sidebar">
              <div className="vp-side-head">
                <div className="vp-side-eyebrow"><i data-lucide="landmark"></i><span>Không gian dân sinh</span></div>
                <h3 className="vp-side-title">Quản trị Thôn / Bản</h3>
                <p className="vp-side-desc">Thông tin hành chính, sinh hoạt nội bộ & phản ánh kiến nghị</p>
              </div>

              <div className="vp-side-list">
                <span className="vp-side-label">Danh sách Thôn/Bản</span>
                <div className="vp-side-items">
                  {(appData.villageDetails || []).map(village => (
                    <button
                      key={village.id}
                      type="button"
                      onClick={() => setSelectedVillageId(village.id)}
                      aria-current={selectedVillageId === village.id ? 'true' : undefined}
                      className={`vp-side-item ${selectedVillageId === village.id ? 'is-active' : ''}`}
                    >
                      <span className="vp-side-name">
