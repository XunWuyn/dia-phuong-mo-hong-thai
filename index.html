      const [subTab, setSubTab] = useState('overview');
      // Hồ sơ thôn được xác định bằng villageId của tài khoản (ổn định), tên thôn chỉ là dự phòng
      const resolvedVillage = currentUser && currentUser.villageId ? (appData.villageDetails || []).find(v => v.id === currentUser.villageId) : null;
      const currentVillageLeader = resolvedVillage ? resolvedVillage.name : (currentUser ? currentUser.village : 'Thôn Khâu Tràng');
      
      const villageData = useMemo(() => {
        return (appData.villageDetails || []).find(v => v.name === currentVillageLeader) || (appData.villageDetails || [])[0];
      }, [appData.villageDetails, currentVillageLeader]);

      const [showNoticeModal, setShowNoticeModal] = useState(false);
      const [noticeTitle, setNoticeTitle] = useState('');
      const [noticeContent, setNoticeContent] = useState('');
      const [noticeCategory, setNoticeCategory] = useState('Sinh hoạt');

      const [showEventModal, setShowEventModal] = useState(false);
      const [eventTitle, setEventTitle] = useState('');
      const [eventDesc, setEventDesc] = useState('');
      const [eventStart, setEventStart] = useState('');
      const [eventLocation, setEventLocation] = useState('');

      const handleCreateNotice = (e) => {
        e.preventDefault();
        if (!noticeTitle || !noticeContent) return;

        const newPending = {
          id: `pend-${Date.now()}`,
          type: 'notice',
          title: noticeTitle,
          category: noticeCategory,
          village: currentVillageLeader,
          author: `Trưởng thôn (${currentVillageLeader})`,
          date: new Date().toLocaleString('vi-VN'),
          description: noticeContent,
          status: 'pending'
        };

        setAppData(prev => ({
          ...prev,
          pendingItems: [newPending, ...(prev.pendingItems || [])]
        }));

        setNoticeTitle('');
        setNoticeContent('');
        setShowNoticeModal(false);
        showToast('Đã gửi thông báo chờ Quản trị viên cấp xã duyệt!');
        addLog(`Trưởng thôn gửi thông báo: ${noticeTitle}`, 'Bảng tin và thông báo');
      };

      const handleCreateEvent = (e) => {
        e.preventDefault();
        if (!eventTitle || !eventStart) return;

        const newPending = {
          id: `pend-${Date.now()}`,
          type: 'event',
          title: eventTitle,
          category: 'Sự kiện',
          village: currentVillageLeader,
          author: `Trưởng thôn (${currentVillageLeader})`,
          date: new Date().toLocaleString('vi-VN'),
          description: eventDesc || eventTitle,
          status: 'pending'
        };

        setAppData(prev => ({
          ...prev,
          pendingItems: [newPending, ...(prev.pendingItems || [])]
        }));

        setEventTitle('');
        setEventDesc('');
        setEventStart('');
        setEventLocation('');
        setShowEventModal(false);
        showToast('Đã tạo sự kiện và gửi chờ cấp xã duyệt!');

      };

        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-1 flex flex-col">

              </p>

                </div>
                {(appData.kpiTasks || []).filter(t => t.village === currentVillageLeader && (kpiIsOverdue(t, kpiToday()) || (t.status === 'in_progress' && t.revisionRequested))).length > 0 && (

                )}
              </button>
            </div>

              )}

                    <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-1">
                      <div className="text-xs text-slate-400 font-medium">Tổng số hộ dân</div>
                      <div className="text-3xl font-black text-forest-600">{villageData?.households} hộ</div>
                    </div>

                    <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-1">

    // --- QUẢN LÝ TÀI KHOẢN & VAI TRÒ (Admin xã) ---
    // Dùng CHÍNH appData.accounts làm nguồn dữ liệu duy nhất (cũng là nguồn của màn hình đăng nhập).
    // Trạng thái: status = 'active' | 'locked'; xóa mềm: deleted = true (không xóa cứng để giữ lịch sử).
    const ACC_INPUT = 'w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-forest-600 text-xs bg-white';
    const ACC_MIN_PW = 3; // độ dài mật khẩu tối thiểu (đổi số này nếu muốn chặt hơn)
    const ACC_BTN = 'px-2 py-1 rounded-lg font-bold text-[10px] transition whitespace-nowrap ';

    function accShort(village) { return String(village || '').replace(/^Thôn\s+/i, '').trim(); }
    function accLabel(acc) {
      return acc.role === 'village_leader' ? `trưởng thôn ${accShort(acc.village)}` : `quản trị ${acc.name}`;
    }
    function accToday() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }
    function accFmtDate(iso) {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
      return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso || '—');
    }
    function accFmtDateTime(iso) {
      if (!iso) return 'Chưa đăng nhập';
      const d = new Date(iso);
      return isNaN(d.getTime()) ? 'Chưa đăng nhập' : d.toLocaleString('vi-VN');
    }

    // ---- Popup thêm / sửa tài khoản ----

    // ---- Popup đổi mật khẩu ----
    function AccountPasswordModal({ acc, onClose, onSave }) {

    // ---- Popup xác nhận (khóa / xóa) ----
    function AccountConfirmModal({ title, children, confirmText, danger, onClose, onConfirm }) {
      return (
        <div className="fixed inset-0 z-[60] bg-black/50 flex items-center justify-center p-4" onClick={onClose}>
          <div onClick={(e) => e.stopPropagation()} className="bg-white rounded-3xl p-6 w-full max-w-sm space-y-4 text-xs shadow-2xl">

    function AccountManager({ appData, setAppData, showToast, addLog }) {
      const [q, setQ] = useState('');
      const [fStatus, setFStatus] = useState('all');
      const [fVillage, setFVillage] = useState('all');
      const [modal, setModal] = useState(null); // { type: 'form' | 'pw' | 'lock' | 'delete', acc? }

      const accounts = appData.accounts || [];
      const villages = (appData.villageDetails || []).map(v => v.name);

      // Mỗi thôn chỉ có 1 tài khoản Trưởng thôn đang hoạt động (không tính tài khoản đã xóa)
      const villageHasActive = (village, exceptId) => accounts.some(a =>
        !a.deleted && a.role === 'village_leader' && a.status === 'active' && a.village === village && a.id !== exceptId);
      const DUP_MSG = 'Thôn này đã có tài khoản quản trị. Hãy khóa hoặc thay thế tài khoản cũ trước.';

      const patchAccount = (id, patch) => {
        setAppData(prev => ({ ...prev, accounts: (prev.accounts || []).map(a => a.id === id ? { ...a, ...patch } : a) }));
      };

      const validateContact = (f) => {
        const phone = f.phone.trim();
        const email = f.email.trim();
        if (phone && !/^[0-9+\s.\-]{8,15}$/.test(phone)) return 'Số điện thoại không hợp lệ.';
        if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return 'Email không hợp lệ.';
        return '';
      };

      // ---- Thêm tài khoản ----
      const handleCreate = (f) => {
        const name = f.name.trim();
        const username = f.username.trim().toLowerCase();
        if (!name) return 'Vui lòng nhập tên trưởng thôn.';
        if (!username) return 'Vui lòng nhập tên đăng nhập.';
        if (!/^[a-z0-9_.]{3,}$/.test(username)) return 'Tên đăng nhập chỉ gồm chữ không dấu, số, dấu _ hoặc . và tối thiểu 3 ký tự.';
        if (accounts.some(a => !a.deleted && String(a.username).toLowerCase() === username)) return 'Tên đăng nhập này đã tồn tại.';
        if (f.password.length < ACC_MIN_PW) return `Mật khẩu ban đầu cần tối thiểu ${ACC_MIN_PW} ký tự.`;
        if (!f.village || !villages.includes(f.village)) return 'Vui lòng chọn thôn phụ trách.';
        const contactErr = validateContact(f);
        if (contactErr) return contactErr;
        if (f.status === 'active' && villageHasActive(f.village, null)) return DUP_MSG;

        const newAcc = {
          id: 'acc-' + Date.now(),
          name, username,
          role: 'village_leader',
          village: f.village,
          villageId: ((appData.villageDetails || []).find(v => v.name === f.village) || {}).id || '',
          password: f.password,
          status: f.status === 'locked' ? 'locked' : 'active',
          deleted: false,
          created: accToday(),
          lastLogin: '',
          phone: f.phone.trim(),
          email: f.email.trim()
        };
        setAppData(prev => ({ ...prev, accounts: [...(prev.accounts || []), newAcc] }));
        addLog(`Admin tạo tài khoản trưởng thôn ${accShort(f.village)}`, 'Quản lý tài khoản');
        showToast(`Đã tạo tài khoản ${username}. Có thể đăng nhập ngay.`);
        setModal(null);
        return '';
      };

      // ---- Sửa tài khoản (không cho sửa role, village, id, username) ----
      const handleEdit = (acc, f) => {
        const name = f.name.trim();
        if (!name) return 'Vui lòng nhập tên người phụ trách.';
        const contactErr = validateContact(f);
        if (contactErr) return contactErr;
        const newStatus = f.status === 'locked' ? 'locked' : 'active';
        if (acc.villageInactive && newStatus === 'active') return 'Thôn của tài khoản này không còn hoạt động nên không thể chuyển sang Hoạt động.';
        if (acc.role === 'village_leader' && newStatus === 'active' && acc.status !== 'active' && villageHasActive(acc.village, acc.id)) return DUP_MSG;

        patchAccount(acc.id, { name, phone: f.phone.trim(), email: f.email.trim(), status: newStatus });
        addLog(`Admin cập nhật thông tin tài khoản ${accLabel(acc)}`, 'Quản lý tài khoản');
        if (newStatus !== acc.status) {
          addLog(`Admin ${newStatus === 'locked' ? 'khóa' : 'mở khóa'} tài khoản ${accLabel(acc)}`, 'Quản lý tài khoản');
        }
        showToast('Đã cập nhật tài khoản!');
        setModal(null);
        return '';
      };

      // ---- Đổi mật khẩu ----
      const handlePassword = (acc, pw, pw2) => {
        if (pw.length < ACC_MIN_PW) return `Mật khẩu mới cần tối thiểu ${ACC_MIN_PW} ký tự.`;
        if (pw !== pw2) return 'Hai mật khẩu nhập vào không khớp.';
        patchAccount(acc.id, { password: pw });
        addLog(`Admin đã cấp lại mật khẩu cho tài khoản ${accLabel(acc)}.`, 'Quản lý tài khoản');
        showToast('Đã đổi mật khẩu. Chỉ mật khẩu mới được chấp nhận khi đăng nhập.');
        setModal(null);
        return '';
      };

      // ---- Khóa / Mở khóa / Xóa ----
      const doLock = (acc) => {
        patchAccount(acc.id, { status: 'locked' });
        addLog(`Admin khóa tài khoản ${accLabel(acc)}`, 'Quản lý tài khoản');
        showToast('Đã khóa tài khoản.', 'info');
        setModal(null);
      };
      const doUnlock = (acc) => {
        if (acc.villageInactive) {
          showToast('Thôn của tài khoản này không còn hoạt động nên không thể mở khóa.', 'error');
          return;
        }
        if (acc.role === 'village_leader' && villageHasActive(acc.village, acc.id)) {
          showToast(DUP_MSG, 'error');
          return;
        }
        patchAccount(acc.id, { status: 'active' });
        addLog(`Admin mở khóa tài khoản ${accLabel(acc)}`, 'Quản lý tài khoản');
        showToast('Đã mở khóa tài khoản.');
      };
      const doDelete = (acc) => {
        patchAccount(acc.id, { deleted: true, deletedAt: new Date().toISOString() });
        addLog(`Admin xóa tài khoản ${accLabel(acc)}`, 'Quản lý tài khoản');
        showToast('Đã xóa tài khoản (lịch sử vẫn được lưu).', 'info');
        setModal(null);
      };

      // ---- Lọc danh sách ----
      const keyword = q.trim().toLowerCase();
      const list = accounts.filter(a => {
        if (fStatus === 'deleted') { if (!a.deleted) return false; }
        else {
          if (a.deleted) return false;
          if (fStatus !== 'all' && a.status !== fStatus) return false;
        }
        if (fVillage === '__inactive') { if (!a.villageInactive) return false; }
        else if (fVillage === '__commune') { if (a.village) return false; }
        else if (fVillage !== 'all' && a.village !== fVillage) return false;
        if (keyword && !`${a.name} ${a.username} ${a.village || ''} ${a.phone || ''} ${a.email || ''}`.toLowerCase().includes(keyword)) return false;
        return true;
      });

      return (
        <div className="ad-ac" data-ad="accounts">
          <div className="ad-ac-head">
            <h3 className="ad-ac-title">Quản lý tài khoản và phân quyền hệ thống</h3>
            <button onClick={() => setModal({ type: 'form', acc: null })} className="ad-ac-add">+ Thêm tài khoản</button>
          </div>

          {/* Thanh công cụ */}
          <div className="ad-ac-tools">
            <input type="text" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Tìm kiếm tên, tài khoản, thôn..." className="ad-ac-ctl ad-ac-search" />
            <select value={fStatus} onChange={(e) => setFStatus(e.target.value)} className="ad-ac-ctl ad-ac-select">
              <option value="all">Tất cả trạng thái</option>
              <option value="active">Hoạt động</option>
              <option value="locked">Khóa</option>
              <option value="deleted">Đã xóa</option>
            </select>
            <select value={fVillage} onChange={(e) => setFVillage(e.target.value)} className="ad-ac-ctl ad-ac-select">
              <option value="all">Tất cả thôn</option>
              <option value="__commune">Toàn xã</option>
              <option value="__inactive">Thôn ngưng hoạt động</option>
              {villages.map(v => <option key={v} value={v}>{v}</option>)}
            </select>
          </div>

          <div className="ad-ac-wrap">
            <table className="ad-ac-table">
              <thead>
                <tr>
                  <th>Họ tên</th>
                  <th>Tên đăng nhập</th>
                  <th>Vai trò</th>
                  <th>Phạm vi phụ trách</th>
                  <th>Trạng thái</th>
                  <th>Ngày cấp</th>
                  <th>Lần đăng nhập cuối</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody>
                {list.length === 0 && (
                  <tr><td colSpan="8" className="ad-ac-empty">Không có tài khoản nào phù hợp.</td></tr>
                )}
                {list.map(acc => (
                  <tr key={acc.id}>
                    <td className="ad-ac-name">
                      {acc.name}
                      {(acc.phone || acc.email) && <div className="ad-ac-sub">{[acc.phone, acc.email].filter(Boolean).join(' · ')}</div>}
                    </td>
                    <td className="ad-ac-user">{acc.username}</td>
                    <td><span className="ad-ac-tag">{acc.role}</span></td>
                    <td className="ad-ac-scope">
                      {acc.village || 'Toàn xã'}
                      {acc.villageInactive && <div className="ad-ac-warn">Thôn ngưng hoạt động — cần đối chiếu</div>}
                    </td>
                    <td>
                      {acc.deleted
                        ? <span className="ad-ac-st is-del">Đã xóa</span>
                        : acc.status === 'active'
                          ? <span className="ad-ac-st is-ok">Hoạt động</span>
                          : <span className="ad-ac-st is-lock">Khóa</span>}
                    </td>
                    <td className="ad-ac-nowrap">{accFmtDate(acc.created)}</td>
                    <td className="ad-ac-nowrap">{accFmtDateTime(acc.lastLogin)}</td>
                    <td>
                      {acc.deleted ? <span className="ad-ac-never">—</span> : (
                        <div className="ad-ac-actions">
                          <button onClick={() => setModal({ type: 'form', acc })} className="ad-ac-act">Sửa</button>
                          <button onClick={() => setModal({ type: 'pw', acc })} className="ad-ac-act">Đổi mật khẩu</button>
                          {acc.role === 'village_leader' && (acc.status === 'active'
                            ? <button onClick={() => setModal({ type: 'lock', acc })} className="ad-ac-act">Khóa</button>
                            : <button onClick={() => doUnlock(acc)} className="ad-ac-act">Mở khóa</button>)}
                          {acc.role === 'village_leader' && (
                            <button onClick={() => setModal({ type: 'delete', acc })} className="ad-ac-act is-danger">Xóa</button>
                          )}
                        </div>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {modal && modal.type === 'form' && (
            <AccountFormModal
              key={modal.acc ? modal.acc.id : 'new'}
              initial={modal.acc}
              villages={villages}
              onClose={() => setModal(null)}
              onSave={(f) => modal.acc ? handleEdit(modal.acc, f) : handleCreate(f)}
            />
          )}
          {modal && modal.type === 'pw' && (
            <AccountPasswordModal acc={modal.acc} onClose={() => setModal(null)} onSave={(pw, pw2) => handlePassword(modal.acc, pw, pw2)} />
          )}
          {modal && modal.type === 'lock' && (
            <AccountConfirmModal title="Khóa tài khoản" confirmText="Khóa" onClose={() => setModal(null)} onConfirm={() => doLock(modal.acc)}>
              <p>Bạn có chắc muốn khóa tài khoản này?</p>
              <p>Sau khi khóa sẽ không thể đăng nhập.</p>
              <p className="font-mono font-bold text-slate-800 pt-1">{modal.acc.username}</p>
            </AccountConfirmModal>
          )}
          {modal && modal.type === 'delete' && (
            <AccountConfirmModal title="Xóa tài khoản" confirmText="Xóa" danger onClose={() => setModal(null)} onConfirm={() => doDelete(modal.acc)}>
              <p>Bạn có chắc muốn xóa tài khoản này?</p>
              <p>Tài khoản sẽ bị ẩn khỏi danh sách và không thể đăng nhập. Dữ liệu được giữ lại để không mất lịch sử.</p>
              <p className="font-mono font-bold text-slate-800 pt-1">{modal.acc.username}</p>
            </AccountConfirmModal>
          )}
        </div>
      );
    }

    // ---- Popup cập nhật hồ sơ thôn (Admin xã) — dùng để thay dữ liệu mô phỏng bằng dữ liệu chính thức ----
    function VillageProfileModal({ village, onClose, onSave }) {
      const [f, setF] = useState(() => ({
        leader: village.leader || '', households: String(village.households ?? ''), population: String(village.population ?? ''),
        ethnicities: village.ethnicities || '', production: village.production || '', culture: village.culture || '', development: village.development || '',
        official: false
      }));
      const [err, setErr] = useState('');
      const set = (k) => (e) => setF(prev => ({ ...prev, [k]: e.target.value }));
      const submit = (e) => {
        e.preventDefault();
        const msg = onSave(f);
        if (msg) setErr(msg);
      };
      return (
        <div className="fixed inset-0 z-[60] bg-black/50 flex items-center justify-center p-4" onClick={onClose}>
          <form onSubmit={submit} onClick={(e) => e.stopPropagation()} className="bg-white rounded-3xl p-6 w-full max-w-xl max-h-[90vh] overflow-y-auto space-y-3 text-xs shadow-2xl">
            <h3 className="text-lg font-extrabold text-slate-900">Cập nhật hồ sơ {village.name}</h3>
            {err && <div className="p-2.5 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl font-semibold">{err}</div>}
            <div>
              <label className="block font-bold text-slate-700 mb-1">Trưởng thôn / BQL</label>
              <input type="text" value={f.leader} onChange={set('leader')} className={ACC_INPUT} />
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block font-bold text-slate-700 mb-1">Số hộ</label>
                <input type="number" min="0" value={f.households} onChange={set('households')} className={ACC_INPUT} />
              </div>
              <div>
                <label className="block font-bold text-slate-700 mb-1">Nhân khẩu</label>
                <input type="number" min="0" value={f.population} onChange={set('population')} className={ACC_INPUT} />
              </div>
            </div>
            <div>
              <label className="block font-bold text-slate-700 mb-1">Dân tộc anh em chính</label>
              <input type="text" value={f.ethnicities} onChange={set('ethnicities')} className={ACC_INPUT} />
            </div>
            <div>
              <label className="block font-bold text-slate-700 mb-1">Đặc điểm địa lý & Sản xuất</label>
              <textarea rows="3" value={f.production} onChange={set('production')} className={ACC_INPUT}></textarea>
            </div>
            <div>
              <label className="block font-bold text-slate-700 mb-1">Văn hóa & Cộng đồng</label>
              <textarea rows="2" value={f.culture} onChange={set('culture')} className={ACC_INPUT}></textarea>
            </div>
            <div>
              <label className="block font-bold text-slate-700 mb-1">Định hướng phát triển</label>
              <textarea rows="2" value={f.development} onChange={set('development')} className={ACC_INPUT}></textarea>
            </div>
            <label className="flex items-start gap-2 p-2.5 bg-amber-50 border border-amber-200 rounded-xl text-amber-900 font-semibold">
              <input type="checkbox" checked={f.official} onChange={(e) => setF(prev => ({ ...prev, official: e.target.checked }))} className="mt-0.5" />
              <span>Các thông tin trên đã được xác minh là dữ liệu chính thức (gỡ toàn bộ nhãn mô phỏng của thôn này)</span>
            </label>
            <div className="flex justify-end gap-2 pt-2">
              <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-100 font-bold">Hủy</button>
              <button type="submit" className="px-5 py-2 rounded-xl bg-community-600 text-white font-bold">Lưu</button>
            </div>
          </form>
        </div>
      );
    }

    // --- VIEW 4B: TRUNG TÂM QUẢN TRỊ ADMIN XÃ ---
    function AdminSocialDashboard({ appData, setAppData, setActiveTab, showToast, addLog }) {
      const [adminSubTab, setAdminSubTab] = useState('overview');
      const [editVillage, setEditVillage] = useState(null);

      const saveVillageProfile = (village, f) => {
        const hh = Number(f.households), pp = Number(f.population);
        if (!Number.isFinite(hh) || hh < 0 || !Number.isFinite(pp) || pp < 0) return 'Số hộ và nhân khẩu phải là số không âm.';
        const patch = {
          leader: f.leader.trim() || VILLAGE_NA,
          households: Math.round(hh), population: Math.round(pp),
          ethnicities: f.ethnicities.trim() || VILLAGE_NA,
          production: f.production.trim() || VILLAGE_NA,
          culture: f.culture.trim(), development: f.development.trim(),
          contentVersion: 2
        };
        if (patch.leader !== village.leader) patch.leaderIsDemo = false;
        if (patch.ethnicities !== village.ethnicities) patch.ethnicitiesIsDemo = false;
        if (f.official) { patch.isDemo = false; patch.leaderIsDemo = false; patch.ethnicitiesIsDemo = false; }
        setAppData(prev => ({ ...prev, villageDetails: (prev.villageDetails || []).map(v => v.id === village.id ? { ...v, ...patch } : v) }));
        addLog(`Admin cập nhật hồ sơ ${village.name}${f.official ? ' (xác nhận dữ liệu chính thức)' : ''}`, 'Quản lý thôn');
        showToast('Đã cập nhật hồ sơ thôn!');
        setEditVillage(null);
        return '';
      };

      const stats = useMemo(() => {
        return {
          villages: (appData.villageDetails || []).length,
          accounts: (appData.accounts || []).filter(a => !a.deleted).length,
          notices: (appData.notices || []).length,
          pending: (appData.pendingItems || []).length,
          feedbacks: (appData.villageDetails || []).reduce((acc, v) => acc + (v.feedbacks || []).length, 0)
        };
      }, [appData]);

      const handleModerate = (item, action) => {
        if (action === 'approve') {
          if (item.type === 'cultural') {
            const newCult = {
              id: `cult-${Date.now()}`,
              title: item.title,
              category: item.category || 'Văn hóa',
              village: item.village,
              date: 'Mới cập nhật',
              image: 'https://images.unsplash.com/photo-1528164344705-47542687990d?auto=format&fit=crop&w=800&q=80',
              description: item.description,
              author: item.author,
              status: 'published'
            };
            setAppData(prev => ({
              ...prev,
              culturalStories: [newCult, ...prev.culturalStories],
              pendingItems: prev.pendingItems.filter(i => i.id !== item.id)
            }));
          } else {
            const newNot = {
              id: `not-${Date.now()}`,
              title: item.title,
              category: item.category || 'Thông báo',
              village: item.village,
              date: new Date().toLocaleDateString('vi-VN'),
              content: item.description,
              status: 'published'
            };
            setAppData(prev => ({
              ...prev,
              notices: [newNot, ...prev.notices],
              pendingItems: prev.pendingItems.filter(i => i.id !== item.id)
            }));
          }
          showToast('Đã phê duyệt và công khai nội dung thành công!');
          addLog(`Admin xã phê duyệt nội dung: ${item.title}`, 'Trung tâm kiểm duyệt');
        } else {
          setAppData(prev => ({
            ...prev,
            pendingItems: prev.pendingItems.filter(i => i.id !== item.id)
          }));
          showToast('Đã từ chối bài viết.', 'info');
          addLog(`Admin xã từ chối nội dung: ${item.title}`, 'Trung tâm kiểm duyệt', 'Từ chối');
        }
      };

      return (
        <div className="ad-page max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1 flex flex-col" data-ad="page">
          <div className="ad-head" data-ad="header">
            <div>
              <div className="ad-head-role">Trung tâm quản trị cấp xã</div>
              <h1 className="ad-head-title">Admin xã · BQL Toàn hệ thống</h1>
              <p className="ad-head-desc">
                Quản lý hệ thống dữ liệu, tài khoản và kiểm duyệt nội dung trên toàn địa phương.
              </p>
            </div>
            <button
              type="button"
              onClick={() => {
                localStorage.removeItem('hongthai_current_user');
                setActiveTab('home');
                showToast('Đã đăng xuất tài khoản!', 'info');
              }}
              className="ad-logout"
            >
              Đăng xuất
            </button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-4 gap-6 flex-1">
            <nav className="lg:col-span-1 ad-nav" data-ad="nav">
              <div className="ad-nav-title">Menu Quản Trị Cấp Xã</div>
              
              <button onClick={() => setAdminSubTab('overview')} className={`ad-nav-item ${adminSubTab === 'overview' ? 'is-active' : ''}`}>
                <span className="ad-nav-ico"><i data-lucide="layout-dashboard"></i></span>
                <span className="ad-nav-label">1. Tổng quan hệ thống</span>
              </button>

              <button onClick={() => setAdminSubTab('villages')} className={`ad-nav-item ${adminSubTab === 'villages' ? 'is-active' : ''}`}>
                <span className="ad-nav-ico"><i data-lucide="building-2"></i></span>
                <span className="ad-nav-label">2. Quản lý thôn/bản</span>
              </button>

              <button onClick={() => setAdminSubTab('accounts')} className={`ad-nav-item ${adminSubTab === 'accounts' ? 'is-active' : ''}`}>
                <span className="ad-nav-ico"><i data-lucide="users-cog"></i></span>
                <span className="ad-nav-label">3. Quản lý tài khoản & vai trò</span>
              </button>

              <button onClick={() => setAdminSubTab('moderation')} className={`ad-nav-item ${adminSubTab === 'moderation' ? 'is-active' : ''}`}>
                <span className="ad-nav-ico"><i data-lucide="shield-alert"></i></span>
                <span className="ad-nav-label">4. Trung tâm kiểm duyệt</span>
                {stats.pending > 0 && (
                  <span className="ad-nav-badge">{stats.pending}</span>
                )}
              </button>

              <button onClick={() => setAdminSubTab('logs')} className={`ad-nav-item ${adminSubTab === 'logs' ? 'is-active' : ''}`}>
                <span className="ad-nav-ico"><i data-lucide="history"></i></span>
                <span className="ad-nav-label">5. Nhật ký hoạt động</span>
              </button>

              <button data-kpi-menu="admin" onClick={() => setAdminSubTab('kpi')} className={`ad-nav-item ${adminSubTab === 'kpi' ? 'is-active' : ''}`}>
                <span className="ad-nav-ico"><i data-lucide="target"></i></span>
                <span className="ad-nav-label">6. Theo dõi KPI trưởng thôn</span>
                {(appData.kpiTasks || []).filter(t => !t.villageInactive && t.status === 'pending_review').length > 0 && (
                  <span className="ad-nav-badge">{(appData.kpiTasks || []).filter(t => !t.villageInactive && t.status === 'pending_review').length}</span>
                )}
              </button>
            </nav>

            <div className="lg:col-span-3 space-y-6">
              {adminSubTab === 'kpi' && (
                <KpiAdminPanel appData={appData} setAppData={setAppData} showToast={showToast} addLog={addLog} />
              )}
              {adminSubTab === 'overview' && (
                <div className="space-y-6">
                  <div className="ad-stats" data-ad="stats">
                    <div className="ad-stat">
                      <div className="ad-stat-label">Tổng thôn/bản</div>
                      <div className="ad-stat-num">{stats.villages}</div>
                    </div>
                    <div className="ad-stat">
                      <div className="ad-stat-label">Tài khoản</div>
                      <div className="ad-stat-num">{stats.accounts}</div>
                    </div>
                    <div className="ad-stat">
                      <div className="ad-stat-label">Nội dung chờ duyệt</div>
                      <div className={`ad-stat-num ${stats.pending > 0 ? 'is-attn' : ''}`}>{stats.pending}</div>
                    </div>
                    <div className="ad-stat">
                      <div className="ad-stat-label">Phản ánh</div>
                      <div className="ad-stat-num">{stats.feedbacks}</div>
                    </div>
                  </div>
                </div>
              )}

              {adminSubTab === 'villages' && (
                <div className="space-y-4" data-ad="villages">
                  <h3 className="ad-vl-title">Quản lý toàn bộ thôn / bản</h3>
                  <div className="ad-vl-grid">
                    {(appData.villageDetails || []).map(v => (
                      <div key={v.id} className="ad-vl-card" data-village={v.id}>
                        <div className="ad-vl-top">
                          <span className="ad-vl-name">{v.name}</span>
                          <span className="ad-vl-status">Hoạt động</span>
                        </div>
                        <p className="ad-vl-desc">{v.desc}</p>
                        {v.isDemo && <span className="ad-vl-tag" title={VILLAGE_DEMO_LABEL}>Dữ liệu mô phỏng</span>}
                        <dl className="ad-vl-data">
                          <div>
                            <dt>Trưởng thôn</dt>
                            <dd>{v.leader}{v.leaderIsDemo && <small>{VILLAGE_LEADER_DEMO_LABEL}</small>}</dd>
                          </div>
                          <div>
                            <dt>Số hộ</dt>
                            <dd>{v.households} hộ</dd>
                          </div>
                          <div>
                            <dt>Nhân khẩu</dt>
                            <dd>{v.population} người</dd>
                          </div>
                        </dl>
                        <div className="ad-vl-foot">
                          {v.isDemo && (
                            <button onClick={() => setEditVillage(v)} className="ad-vl-btn">Cập nhật hồ sơ</button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                  {editVillage && (
                    <VillageProfileModal key={editVillage.id} village={editVillage} onClose={() => setEditVillage(null)} onSave={(f) => saveVillageProfile(editVillage, f)} />
                  )}
                  {(appData.archivedVillages || []).length > 0 && (
                    <details className="rounded-md bg-white border border-slate-200 p-4 text-xs">
                      <summary className="cursor-pointer font-bold text-slate-600">Hồ sơ thôn đã ngưng hoạt động ({(appData.archivedVillages || []).length}) — lưu để đối chiếu</summary>
                      <div className="pt-3 space-y-2">
                        {(appData.archivedVillages || []).map(v => (
                          <div key={v.id} className="flex flex-wrap items-center justify-between gap-2 p-3 rounded-xl bg-slate-50 border">
                            <span className="font-bold text-slate-700">{v.name}</span>
                            <span className="text-slate-500">{(appData.accounts || []).filter(a => a.village === v.name).length} tài khoản · {(appData.kpiTasks || []).filter(t => t.village === v.name).length} nhiệm vụ KPI · cần đối chiếu</span>
                          </div>
                        ))}
                        <p className="text-slate-400 italic">Các hồ sơ này không còn xuất hiện trong danh sách thôn đang hoạt động, bộ lọc và thống kê.</p>
                      </div>
                    </details>
                  )}
                </div>
              )}

              {adminSubTab === 'accounts' && (
                <AccountManager appData={appData} setAppData={setAppData} showToast={showToast} addLog={addLog} />
              )}

              {adminSubTab === 'moderation' && (
                <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-6">
                  <h3 className="text-lg font-extrabold text-slate-900">Trung tâm kiểm duyệt toàn cục</h3>
                  {(!appData.pendingItems || appData.pendingItems.length === 0) ? (
                    <p className="text-xs text-slate-400 italic">Không có nội dung chờ duyệt.</p>
                  ) : (
                    <div className="space-y-4">
                      {appData.pendingItems.map(item => (
                        <div key={item.id} className="p-4 rounded-2xl bg-amber-50 border border-amber-200 space-y-3">
                          <div className="flex justify-between items-center">
                            <span className="px-2 py-0.5 bg-amber-200 text-amber-900 text-[10px] font-bold rounded uppercase">{item.category}</span>
                            <span className="text-xs text-slate-500">{item.village} · {item.author}</span>
                          </div>
                          <h4 className="font-bold text-sm">{item.title}</h4>
                          <p className="text-xs bg-white p-3 rounded-xl border">{item.description}</p>
                          <div className="flex justify-end gap-2">
                            <button onClick={() => handleModerate(item, 'approve')} className="px-4 py-2 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow">Phê duyệt</button>
                            <button onClick={() => handleModerate(item, 'reject')} className="px-4 py-2 bg-rose-600 text-white font-bold text-xs rounded-xl">Từ chối</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {adminSubTab === 'logs' && (
                <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-6">
                  <h3 className="text-lg font-extrabold text-slate-900">Nhật ký hoạt động hệ thống</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-100 font-bold uppercase">
                        <tr>
                          <th className="p-3">Thời gian</th>
                          <th className="p-3">Vai trò</th>
                          <th className="p-3">Hành động</th>
                          <th className="p-3">Kết quả</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y">
                        {(appData.logs || []).map(log => (
                          <tr key={log.id}>
                            <td className="p-3 font-mono">{log.time}</td>
                            <td className="p-3 font-bold">{log.role}</td>
                            <td className="p-3">{log.action}</td>
                            <td className="p-3 text-emerald-600 font-bold">{log.result}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ======================================================================
    // PHÂN HỆ: THEO DÕI KPI TRƯỞNG THÔN
    // Dữ liệu nằm trong appData.kpiTasks (cùng cơ chế lưu localStorage hiện có).
    // Mọi số liệu thống kê đều được tính lại từ danh sách nhiệm vụ này.
    // ======================================================================
    const KPI_STATUS = {
      not_started: { label: 'Chưa bắt đầu', cls: 'bg-slate-100 text-slate-700 border-slate-200' },
      in_progress: { label: 'Đang thực hiện', cls: 'bg-blue-100 text-blue-800 border-blue-200' },
      pending_review: { label: 'Chờ duyệt', cls: 'bg-amber-100 text-amber-800 border-amber-200' },
      completed: { label: 'Đã hoàn thành', cls: 'bg-emerald-100 text-emerald-800 border-emerald-200' },
      cancelled: { label: 'Đã hủy', cls: 'bg-rose-100 text-rose-700 border-rose-200' }
    };
    const KPI_GROUPS = ['Hành chính - Dân sinh', 'Kinh tế - Nông nghiệp', 'Văn hóa - Xã hội', 'Môi trường', 'An ninh - Trật tự', 'Du lịch cộng đồng', 'Khác'];
    const KPI_PRIORITIES = ['Cao', 'Trung bình', 'Thấp'];
    const KPI_PRIORITY_CLS = { 'Cao': 'bg-rose-100 text-rose-700', 'Trung bình': 'bg-amber-100 text-amber-800', 'Thấp': 'bg-slate-100 text-slate-600' };
    const KPI_INPUT = 'w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-forest-600 text-xs bg-white';

    const kpiToday = () => {
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    };
    const kpiDaysBetween = (from, to) => Math.round((new Date(to + 'T00:00:00') - new Date(from + 'T00:00:00')) / 86400000);
    const kpiPeriod = (deadline) => {
      if (!deadline || deadline.split('-').length < 2) return 'Không xác định';
      const [y, m] = deadline.split('-');
      return `Quý ${Math.ceil(Number(m) / 3)}/${y}`;
    };
    const kpiFmtDate = (s) => (s ? s.split('-').reverse().join('/') : '');
    const kpiWeight = (t) => (Number(t.weight) > 0 ? Number(t.weight) : 1);
    const kpiClamp = (n) => Math.max(0, Math.min(100, Number(n) || 0));

    // Quá hạn: chưa hoàn thành/hủy và đã qua thời hạn. Nhiệm vụ đã gửi chờ duyệt chỉ tính quá hạn nếu gửi sau thời hạn.
    function kpiIsOverdue(t, today) {
      if (t.status === 'completed' || t.status === 'cancelled') return false;
      if (t.status === 'pending_review') return !!t.submittedDate && t.submittedDate > t.deadline;
      return !!t.deadline && t.deadline < today;
    }
    function kpiIsDueSoon(t, today) {
      if (['completed', 'cancelled', 'pending_review'].includes(t.status)) return false;
      if (kpiIsOverdue(t, today) || !t.deadline) return false;
      const d = kpiDaysBetween(today, t.deadline);
      return d >= 0 && d <= 7;
    }
    function kpiDueText(t, today) {
      if (t.status === 'completed') return 'Đã được duyệt hoàn thành';
      if (t.status === 'cancelled') return 'Đã hủy';
      if (t.status === 'pending_review') return kpiIsOverdue(t, today) ? 'Gửi muộn, chờ duyệt' : 'Đã gửi, chờ duyệt';
      const d = kpiDaysBetween(today, t.deadline);
      if (d < 0) return `Quá hạn ${-d} ngày`;
      if (d === 0) return 'Hết hạn hôm nay';
      return `Còn ${d} ngày`;
    }

    // Công thức:
    //  - Tiến độ thực hiện = Σ(trọng số × % tiến độ) / Σ(trọng số); nhiệm vụ đã được duyệt hoàn thành tính 100%, nhiệm vụ đã hủy bị loại.
    //  - Tỷ lệ được duyệt hoàn thành = Σ(trọng số nhiệm vụ đã duyệt hoàn thành) / Σ(trọng số) × 100. Nhiệm vụ chờ duyệt KHÔNG được tính.
    function kpiStats(tasks, today) {
      const active = tasks.filter(t => t.status !== 'cancelled');
      const sumW = active.reduce((s, t) => s + kpiWeight(t), 0);
      const execW = active.reduce((s, t) => s + kpiWeight(t) * (t.status === 'completed' ? 100 : kpiClamp(t.progress)), 0);
      const doneW = active.filter(t => t.status === 'completed').reduce((s, t) => s + kpiWeight(t), 0);
      return {
        total: active.length,
        completed: active.filter(t => t.status === 'completed').length,
        inProgress: active.filter(t => t.status === 'in_progress').length,
        notStarted: active.filter(t => t.status === 'not_started').length,
        pendingReview: active.filter(t => t.status === 'pending_review').length,
        overdue: active.filter(t => kpiIsOverdue(t, today)).length,
        cancelled: tasks.length - active.length,
        execProgress: sumW ? Math.round(execW / sumW) : 0,
        approvedRate: sumW ? Math.round((doneW / sumW) * 100) : 0
      };
    }

    // Thông báo hiển thị trong website (tính từ dữ liệu nhiệm vụ, không phải thông báo đẩy/SMS/email)
    function kpiBuildAlerts(tasks, today, mode) {
      const items = [];
      tasks.filter(t => t.status !== 'cancelled').forEach(t => {
        const who = mode === 'admin' ? `${t.village}: ` : '';
        if (kpiIsOverdue(t, today)) {
          items.push({ key: `od-${t.id}`, level: 'danger', rank: 0, taskId: t.id, text: `${who}"${t.title}" ${t.status === 'pending_review' ? 'được gửi muộn so với thời hạn' : `đã quá hạn (${kpiDueText(t, today).toLowerCase()})`}.` });
        } else if (kpiIsDueSoon(t, today)) {
          items.push({ key: `ds-${t.id}`, level: 'warn', rank: 2, taskId: t.id, text: `${who}"${t.title}" sắp đến hạn (${kpiDueText(t, today).toLowerCase()}, hạn ${kpiFmtDate(t.deadline)}).` });
        }
        if (t.status === 'pending_review') {
          items.push(mode === 'admin'
            ? { key: `pr-${t.id}`, level: 'info', rank: 1, taskId: t.id, text: `${t.village} đã gửi kết quả chờ duyệt: "${t.title}".` }
            : { key: `pr-${t.id}`, level: 'info', rank: 3, taskId: t.id, text: `"${t.title}" đang chờ Admin xã duyệt.` });
        }
        if (t.status === 'in_progress' && t.revisionRequested) {
          items.push(mode === 'admin'
            ? { key: `rv-${t.id}`, level: 'info', rank: 3, taskId: t.id, text: `Đã yêu cầu ${t.village} bổ sung cho "${t.title}".` }
            : { key: `rv-${t.id}`, level: 'warn', rank: 1, taskId: t.id, text: `Admin xã yêu cầu bổ sung cho "${t.title}": ${t.reviewNote || 'xem chi tiết nhiệm vụ'}` });
        }
        if (t.status === 'completed' && t.approvedDate && kpiDaysBetween(t.approvedDate, today) <= 7 && kpiDaysBetween(t.approvedDate, today) >= 0) {
          items.push({ key: `ok-${t.id}`, level: 'ok', rank: 4, taskId: t.id, text: `${who}"${t.title}" đã được duyệt hoàn thành (${kpiFmtDate(t.approvedDate)}).` });
        }
      });
      return items.sort((a, b) => a.rank - b.rank);
    }

    const kpiNewHistory = (actor, action, note) => ({
      id: `h-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      time: new Date().toLocaleString('vi-VN'),
      actor,
      action,
      note: note || ''
    });

    // Các thao tác cập nhật dữ liệu KPI (đều đi qua setAppData nên được lưu vào localStorage hiện có)
    function makeKpiActions({ setAppData, showToast, addLog, actor }) {
      const patch = (id, fn, entry, guard) => {
        setAppData(prev => ({
          ...prev,
          kpiTasks: (prev.kpiTasks || []).map(t => {
            if (t.id !== id) return t;
            if (guard && !guard(t)) return t;
            return { ...fn(t), history: [...(t.history || []), entry] };
          })
        }));
      };
      return {
        createTask: (v) => {
          const task = {
            id: `kpi-${Date.now()}`,
            title: v.title, description: v.description, group: v.group, village: v.village,
            priority: v.priority, deadline: v.deadline, criteria: v.criteria, weight: v.weight,
            status: 'not_started', progress: 0, report: '', evidence: '', evidenceFiles: [],
            reviewNote: '', revisionRequested: false, submittedDate: '', approvedDate: '',
            createdDate: kpiToday(),
            history: [kpiNewHistory(actor, 'Tạo nhiệm vụ', `Giao cho ${v.village}, thời hạn ${kpiFmtDate(v.deadline)}`)]
          };
          setAppData(prev => ({ ...prev, kpiTasks: [task, ...(prev.kpiTasks || [])] }));
          showToast('Đã tạo nhiệm vụ KPI và giao cho ' + v.village + '!');
          addLog(`Tạo nhiệm vụ KPI "${v.title}" cho ${v.village}`, 'KPI');
        },
        editTask: (id, v) => {
          patch(id, t => ({ ...t, ...v }), kpiNewHistory(actor, 'Chỉnh sửa nhiệm vụ', `Thôn: ${v.village}, thời hạn ${kpiFmtDate(v.deadline)}, ưu tiên ${v.priority}, trọng số ${v.weight}`),
            t => t.status !== 'completed' && t.status !== 'cancelled');
          showToast('Đã lưu thay đổi nhiệm vụ!');
          addLog(`Sửa nhiệm vụ KPI "${v.title}"`, 'KPI');
        },
        cancelTask: (task) => {
          patch(task.id, t => ({ ...t, status: 'cancelled', revisionRequested: false }), kpiNewHistory(actor, 'Hủy nhiệm vụ', ''),
            t => t.status !== 'completed' && t.status !== 'cancelled');
          showToast('Đã hủy nhiệm vụ!', 'info');
          addLog(`Hủy nhiệm vụ KPI "${task.title}"`, 'KPI');
        },
        review: (task, decision, note) => {
          const cleanNote = (note || '').trim();
          if (decision === 'approve') {
            patch(task.id, t => ({ ...t, status: 'completed', progress: 100, approvedDate: kpiToday(), revisionRequested: false, reviewNote: cleanNote }),
              kpiNewHistory(actor, 'Duyệt hoàn thành', cleanNote), t => t.status === 'pending_review');
            showToast('Đã duyệt nhiệm vụ hoàn thành!');
            addLog(`Duyệt hoàn thành nhiệm vụ KPI "${task.title}" (${task.village})`, 'KPI');
          } else {
            patch(task.id, t => ({ ...t, status: 'in_progress', revisionRequested: true, reviewNote: cleanNote, submittedDate: '' }),
              kpiNewHistory(actor, 'Yêu cầu bổ sung', cleanNote), t => t.status === 'pending_review');
            showToast('Đã yêu cầu thôn bổ sung!', 'info');
            addLog(`Yêu cầu bổ sung nhiệm vụ KPI "${task.title}" (${task.village})`, 'KPI');
          }
        },
        villageUpdate: (task, village, v) => {
          const submitting = v.status === 'pending_review';
          patch(task.id, t => ({
            ...t, status: v.status, progress: v.progress, report: v.report, evidence: v.evidence, evidenceFiles: v.evidenceFiles,
            submittedDate: submitting ? kpiToday() : t.submittedDate,
            revisionRequested: submitting ? false : t.revisionRequested
          }),
          kpiNewHistory(actor, submitting ? 'Gửi kết quả chờ duyệt' : 'Cập nhật tiến độ', `${KPI_STATUS[v.status].label}, tiến độ ${v.progress}%${v.report ? ' · có báo cáo' : ''}${(v.evidence || (v.evidenceFiles || []).length) ? ' · có minh chứng' : ''}`),
          t => t.village === village && (t.status === 'not_started' || t.status === 'in_progress'));
          showToast(submitting ? 'Đã gửi kết quả cho Admin xã duyệt!' : 'Đã lưu cập nhật nhiệm vụ!');
          addLog(`${submitting ? 'Gửi kết quả chờ duyệt' : 'Cập nhật'} nhiệm vụ KPI "${task.title}" (${village})`, 'KPI');
        }
      };
    }

    function KpiBadge({ status }) {
      const s = KPI_STATUS[status] || KPI_STATUS.not_started;
      return <span className={`inline-block px-2 py-0.5 rounded-full border text-[10px] font-bold whitespace-nowrap ${s.cls}`}>{s.label}</span>;
    }

    function KpiBar({ value, color = 'bg-forest-500', height = 'h-2' }) {
      const v = kpiClamp(value);
      return (
        <div className={`w-full ${height} bg-slate-200 rounded-full overflow-hidden`}>
          <div className={`${height} ${color} rounded-full transition-all`} style={{ width: `${v}%` }}></div>
        </div>
      );
    }

    function KpiStatCard({ label, value, sub, tone = 'text-slate-900', testId }) {
      return (
        <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-1" data-kpi={testId}>
          <div className="text-[11px] text-slate-400 font-medium leading-tight">{label}</div>
          <div className={`text-2xl font-black ${tone}`}>{value}</div>
          {sub && <div className="text-[10px] text-slate-400 leading-tight">{sub}</div>}
        </div>
      );
    }

    function KpiAlertsBox({ tasks, mode, onOpen }) {
      const today = kpiToday();
      const alerts = kpiBuildAlerts(tasks, today, mode);
      const LEVEL = {
        danger: 'bg-rose-50 border-rose-200 text-rose-800',
        warn: 'bg-amber-50 border-amber-200 text-amber-900',
        info: 'bg-blue-50 border-blue-200 text-blue-800',
        ok: 'bg-emerald-50 border-emerald-200 text-emerald-800'
      };
      const shown = alerts.slice(0, 8);
      return (
        <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-3" data-kpi="alerts">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <h4 className="text-sm font-extrabold text-slate-900">Thông báo nhắc việc ({alerts.length})</h4>
            <span className="text-[10px] text-slate-400 italic">Chỉ hiển thị trong website, chưa có thông báo đẩy, SMS hay email.</span>
          </div>
          {shown.length === 0 ? (
            <p className="text-xs text-slate-400 italic">Hiện không có nhắc việc nào.</p>
          ) : (
            <div className="space-y-2">
              {shown.map(a => (
                <button key={a.key} type="button" onClick={() => onOpen(a.taskId)} className={`w-full text-left px-3 py-2 rounded-xl border text-xs font-medium hover:opacity-80 transition ${LEVEL[a.level]}`}>
                  {a.text}
                </button>
              ))}
              {alerts.length > shown.length && <p className="text-[10px] text-slate-400">Và {alerts.length - shown.length} thông báo khác.</p>}
            </div>
          )}
        </div>
      );
    }

    function KpiSummary({ stats, title }) {
      return (
        <div className="space-y-3">
          <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3">
            <KpiStatCard testId="total" label="Tổng nhiệm vụ được giao" value={stats.total} sub={stats.cancelled ? `Chưa tính ${stats.cancelled} nhiệm vụ đã hủy` : 'Không tính nhiệm vụ đã hủy'} />
            <KpiStatCard testId="completed" label="Đã hoàn thành (đã duyệt)" value={stats.completed} tone="text-emerald-600" />
            <KpiStatCard testId="inProgress" label="Đang thực hiện" value={stats.inProgress} tone="text-blue-600" />
            <KpiStatCard testId="notStarted" label="Chưa bắt đầu" value={stats.notStarted} tone="text-slate-600" />
            <KpiStatCard testId="pendingReview" label="Chờ duyệt" value={stats.pendingReview} tone="text-amber-600" sub="Chưa được tính là hoàn thành" />
            <KpiStatCard testId="overdue" label="Quá hạn" value={stats.overdue} tone="text-rose-600" sub="Đã nằm trong các nhóm trạng thái" />
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2">
              <div className="flex items-end justify-between"><span className="text-[11px] font-bold text-slate-600">Tiến độ thực hiện</span><span className="text-xl font-black text-blue-600" data-kpi="execProgress">{stats.execProgress}%</span></div>
              <KpiBar value={stats.execProgress} color="bg-blue-500" height="h-2.5" />
            </div>
            <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2">
              <div className="flex items-end justify-between"><span className="text-[11px] font-bold text-slate-600">Tỷ lệ nhiệm vụ được duyệt hoàn thành</span><span className="text-xl font-black text-emerald-600" data-kpi="approvedRate">{stats.approvedRate}%</span></div>
              <KpiBar value={stats.approvedRate} color="bg-emerald-500" height="h-2.5" />
            </div>
          </div>
          <details className="text-[11px] text-slate-500 bg-slate-50 border border-slate-200 rounded-xl p-3">
            <summary className="cursor-pointer font-bold text-slate-600">Cách tính {title}</summary>
            <div className="pt-2 space-y-1 leading-relaxed">
              <p><b>Tiến độ thực hiện</b> = Σ(trọng số × % tiến độ) ÷ Σ(trọng số). Nhiệm vụ đã được duyệt hoàn thành tính 100%; nhiệm vụ chờ duyệt tính theo % trưởng thôn khai báo; nhiệm vụ đã hủy bị loại.</p>
              <p><b>Tỷ lệ được duyệt hoàn thành</b> = Σ(trọng số nhiệm vụ đã được Admin xã duyệt) ÷ Σ(trọng số) × 100. Nhiệm vụ chờ duyệt không được tính.</p>
              <p><b>Quá hạn:</b> chưa hoàn thành hoặc hủy mà đã qua thời hạn; nhiệm vụ đã gửi chờ duyệt chỉ tính quá hạn nếu gửi sau thời hạn. Hệ thống không tự chấm điểm hay đánh giá trưởng thôn.</p>
            </div>
          </details>
        </div>
      );
    }

    // ---- Hộp thoại tạo/sửa nhiệm vụ (Admin xã) ----
    function KpiTaskFormModal({ initial, villages, onClose, onSave }) {
      const [f, setF] = useState(() => ({
        title: initial ? initial.title : '',
        description: initial ? initial.description || '' : '',
        group: initial ? initial.group : KPI_GROUPS[0],
        village: initial ? initial.village : (villages[0] || ''),
        deadline: initial ? initial.deadline : '',
        priority: initial ? initial.priority : 'Trung bình',
        criteria: initial ? initial.criteria || '' : '',
        weight: initial ? String(initial.weight || 1) : '1'
      }));
      const [err, setErr] = useState('');
      const set = (k) => (e) => setF(prev => ({ ...prev, [k]: e.target.value }));

      const submit = (e) => {
        e.preventDefault();
        if (!f.title.trim()) return setErr('Vui lòng nhập tên nhiệm vụ.');
        if (!f.village) return setErr('Vui lòng chọn thôn chịu trách nhiệm.');
        if (!f.deadline) return setErr('Vui lòng chọn thời hạn.');
        const w = Number(f.weight);
        if (!Number.isFinite(w) || w < 1 || w > 10) return setErr('Trọng số phải là số từ 1 đến 10.');
        onSave({ title: f.title.trim(), description: f.description.trim(), group: f.group, village: f.village, deadline: f.deadline, priority: f.priority, criteria: f.criteria.trim(), weight: w });
      };

      return (
        <div className="fixed inset-0 z-[60] bg-black/50 flex items-center justify-center p-4" onClick={onClose}>
          <form onSubmit={submit} onClick={(e) => e.stopPropagation()} className="bg-white rounded-3xl p-6 w-full max-w-xl max-h-[90vh] overflow-y-auto space-y-4 text-xs shadow-2xl" data-kpi="form-modal">
            <h3 className="text-lg font-extrabold text-slate-900">{initial ? 'Sửa nhiệm vụ KPI' : 'Tạo nhiệm vụ KPI mới'}</h3>
            {err && <div className="p-2.5 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl font-semibold">{err}</div>}
            <div>
              <label className="block font-bold text-slate-700 mb-1">Tên nhiệm vụ *</label>
              <input type="text" value={f.title} onChange={set('title')} className={KPI_INPUT} placeholder="Ví dụ: Rà soát hộ nghèo năm 2026" />
            </div>
            <div>
              <label className="block font-bold text-slate-700 mb-1">Mô tả / yêu cầu</label>
              <textarea rows="3" value={f.description} onChange={set('description')} className={KPI_INPUT} placeholder="Nội dung công việc cần thực hiện..."></textarea>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label className="block font-bold text-slate-700 mb-1">Thôn chịu trách nhiệm *</label>
                <select value={f.village} onChange={set('village')} className={KPI_INPUT}>
                  {villages.map(v => <option key={v} value={v}>{v}</option>)}
                </select>
              </div>
              <div>
                <label className="block font-bold text-slate-700 mb-1">Nhóm KPI</label>
                <select value={f.group} onChange={set('group')} className={KPI_INPUT}>
                  {KPI_GROUPS.map(g => <option key={g} value={g}>{g}</option>)}
                </select>
              </div>
              <div>
                <label className="block font-bold text-slate-700 mb-1">Thời hạn *</label>
                <input type="date" value={f.deadline} onChange={set('deadline')} className={KPI_INPUT} />
              </div>
              <div>
                <label className="block font-bold text-slate-700 mb-1">Mức độ ưu tiên</label>
                <select value={f.priority} onChange={set('priority')} className={KPI_INPUT}>
                  {KPI_PRIORITIES.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>
            </div>
            <div>
              <label className="block font-bold text-slate-700 mb-1">Tiêu chí hoàn thành</label>
              <textarea rows="2" value={f.criteria} onChange={set('criteria')} className={KPI_INPUT} placeholder="Ví dụ: Có biên bản, danh sách và ảnh minh chứng..."></textarea>
            </div>
            <div>
              <label className="block font-bold text-slate-700 mb-1">Trọng số (1 - 10)</label>
              <input type="number" min="1" max="10" step="1" value={f.weight} onChange={set('weight')} className={KPI_INPUT} />
              <p className="text-[10px] text-slate-400 mt-1">Dùng để tính tiến độ tổng hợp theo công thức trọng số; để 1 nếu các nhiệm vụ quan trọng ngang nhau.</p>
            </div>
            <div className="flex justify-end gap-2 pt-2">
              <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-100 font-bold">Hủy</button>
              <button type="submit" className="px-5 py-2 rounded-xl bg-community-600 text-white font-bold">{initial ? 'Lưu thay đổi' : 'Tạo và giao nhiệm vụ'}</button>
            </div>
          </form>
        </div>
      );
    }

    // ---- Hộp thoại chi tiết nhiệm vụ: dùng chung cho Admin xã (mode="admin") và Trưởng thôn (mode="village") ----
    function KpiTaskModal({ task, mode, village, actions, onClose, onEdit }) {
      const today = kpiToday();
      const [note, setNote] = useState('');
      const [vStatus, setVStatus] = useState(task.status);
      const [vProgress, setVProgress] = useState(String(task.progress || 0));
      const [vReport, setVReport] = useState(task.report || '');
      const [vEvidence, setVEvidence] = useState(task.evidence || '');
      const [vFiles, setVFiles] = useState(task.evidenceFiles || []);
      const [err, setErr] = useState('');

      const overdue = kpiIsOverdue(task, today);
      const canVillageEdit = mode === 'village' && task.village === village && (task.status === 'not_started' || task.status === 'in_progress');
      const canAdminEdit = mode === 'admin' && task.status !== 'completed' && task.status !== 'cancelled';

      const saveVillage = (e) => {
        e.preventDefault();
        setErr('');
        const p = Number(vProgress);
        if (vProgress === '' || !Number.isFinite(p) || p < 0 || p > 100) return setErr('Tiến độ phải là số từ 0 đến 100.');
        let st = vStatus;
        if (st === 'not_started' && p > 0) st = 'in_progress';
        if (st === 'pending_review') {
          if (!vReport.trim()) return setErr('Cần viết báo cáo kết quả trước khi gửi Admin xã duyệt.');
          if (p < 100) return setErr('Chỉ gửi duyệt khi tiến độ đạt 100%. Nếu chưa xong, hãy chọn "Đang thực hiện" rồi lưu cập nhật.');
        }
        actions.villageUpdate(task, village, { status: st, progress: Math.round(p), report: vReport.trim(), evidence: vEvidence.trim(), evidenceFiles: vFiles });
        if (st === 'pending_review') onClose();
      };

      const doReview = (decision) => {
        if (decision === 'revise' && !note.trim()) return setErr('Cần ghi rõ nội dung yêu cầu bổ sung.');
        actions.review(task, decision, note);
        onClose();
      };

      const doCancel = () => {
        if (window.confirm(`Bạn có chắc chắn muốn hủy nhiệm vụ "${task.title}"? Nhiệm vụ đã hủy sẽ không được tính vào KPI.`)) {
          actions.cancelTask(task);
          onClose();
        }
      };

      const onFiles = (e) => {
        const picked = Array.from(e.target.files || []).map(f => ({ name: f.name, size: f.size }));
        if (picked.length) setVFiles(prev => [...prev, ...picked]);
        e.target.value = '';
      };

      return (
        <div className="fixed inset-0 z-[60] bg-black/50 flex items-center justify-center p-4" onClick={onClose}>
          <div onClick={(e) => e.stopPropagation()} className="bg-white rounded-3xl p-6 w-full max-w-2xl max-h-[90vh] overflow-y-auto space-y-4 text-xs shadow-2xl" data-kpi="task-modal">
            <div className="flex items-start justify-between gap-3">
              <div className="space-y-1">
                <div className="flex flex-wrap items-center gap-2">
                  <KpiBadge status={task.status} />
                  <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${KPI_PRIORITY_CLS[task.priority] || KPI_PRIORITY_CLS['Thấp']}`}>Ưu tiên: {task.priority}</span>
                  {overdue && <span className="px-2 py-0.5 rounded-full bg-rose-600 text-white text-[10px] font-bold">QUÁ HẠN</span>}
                  {task.revisionRequested && task.status === 'in_progress' && <span className="px-2 py-0.5 rounded-full bg-amber-500 text-white text-[10px] font-bold">CẦN BỔ SUNG</span>}
                </div>
                <h3 className="text-lg font-extrabold text-slate-900 leading-snug">{task.title}</h3>
                <div className="text-slate-500">{task.village} · {task.group} · Kỳ báo cáo {kpiPeriod(task.deadline)}</div>
              </div>
              <button type="button" onClick={onClose} className="px-3 py-1.5 rounded-lg bg-slate-100 font-bold hover:bg-slate-200">Đóng</button>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div className="p-3 rounded-xl bg-slate-50 border border-slate-200"><div className="text-slate-400">Thời hạn</div><div className="font-bold text-slate-800">{kpiFmtDate(task.deadline)}</div><div className={overdue ? 'text-rose-600 font-bold' : 'text-slate-500'}>{kpiDueText(task, today)}</div></div>
              <div className="p-3 rounded-xl bg-slate-50 border border-slate-200"><div className="text-slate-400">Trọng số</div><div className="font-bold text-slate-800">{kpiWeight(task)}</div></div>
              <div className="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-1"><div className="text-slate-400">Tiến độ khai báo</div><div className="font-bold text-slate-800" data-kpi="task-progress">{kpiClamp(task.progress)}%</div><KpiBar value={task.progress} color="bg-blue-500" /></div>
            </div>

            {task.description && <div><div className="font-bold text-slate-700 mb-1">Mô tả / yêu cầu</div><p className="text-slate-600 leading-relaxed whitespace-pre-line">{task.description}</p></div>}
            {task.criteria && <div><div className="font-bold text-slate-700 mb-1">Tiêu chí hoàn thành</div><p className="text-slate-600 leading-relaxed whitespace-pre-line">{task.criteria}</p></div>}

            {(task.report || task.evidence || (task.evidenceFiles || []).length > 0) && !canVillageEdit && (
              <div className="p-3 rounded-xl bg-blue-50 border border-blue-100 space-y-2">
                <div className="font-bold text-blue-900">Kết quả và minh chứng đã báo cáo</div>
                {task.report && <p className="text-slate-700 whitespace-pre-line"><b>Báo cáo:</b> {task.report}</p>}
                {task.evidence && <p className="text-slate-700 whitespace-pre-line"><b>Minh chứng:</b> {task.evidence}</p>}
                {(task.evidenceFiles || []).length > 0 && <p className="text-slate-700"><b>Tệp minh chứng:</b> {(task.evidenceFiles || []).map(f => f.name).join(', ')}</p>}
              </div>
            )}

            {task.reviewNote && (task.status === 'in_progress' || task.status === 'completed') && (
              <div className={`p-3 rounded-xl border ${task.status === 'completed' ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-amber-50 border-amber-200 text-amber-900'}`}>
                <b>{task.status === 'completed' ? 'Ghi chú duyệt của Admin xã: ' : 'Admin xã yêu cầu bổ sung: '}</b>{task.reviewNote}
              </div>
            )}

            {err && <div className="p-2.5 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl font-semibold" data-kpi="modal-error">{err}</div>}

            {canVillageEdit && (
              <form onSubmit={saveVillage} className="p-4 rounded-2xl border border-emerald-200 bg-emerald-50/40 space-y-3" data-kpi="village-form">
                <div className="font-extrabold text-slate-900">Cập nhật nhiệm vụ</div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Trạng thái</label>
                    <select value={vStatus} onChange={(e) => setVStatus(e.target.value)} className={KPI_INPUT}>
                      <option value="not_started">Chưa bắt đầu</option>
                      <option value="in_progress">Đang thực hiện</option>
                      <option value="pending_review">Chờ duyệt (gửi Admin xã)</option>
                      <option value="completed" disabled>Đã hoàn thành (chỉ Admin xã được duyệt)</option>
                    </select>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Tiến độ (%)</label>
                    <input type="number" min="0" max="100" value={vProgress} onChange={(e) => setVProgress(e.target.value)} className={KPI_INPUT} />
                  </div>
                </div>
                <div>
                  <label className="block font-bold text-slate-700 mb-1">Báo cáo kết quả</label>
                  <textarea rows="3" value={vReport} onChange={(e) => setVReport(e.target.value)} className={KPI_INPUT} placeholder="Đã làm được những gì, kết quả cụ thể..."></textarea>
                </div>
                <div>
                  <label className="block font-bold text-slate-700 mb-1">Minh chứng (mô tả hoặc đường dẫn)</label>
                  <textarea rows="2" value={vEvidence} onChange={(e) => setVEvidence(e.target.value)} className={KPI_INPUT} placeholder="Ví dụ: Biên bản họp ngày..., ảnh lưu tại..."></textarea>
                </div>
                <div>
                  <label className="block font-bold text-slate-700 mb-1">Tệp minh chứng</label>
                  <input type="file" multiple onChange={onFiles} className="block w-full text-[11px]" />
                  <p className="text-[10px] text-slate-400 mt-1">Bản demo chỉ lưu tên và dung lượng tệp trong trình duyệt, không lưu nội dung tệp.</p>
                  {vFiles.length > 0 && (
                    <ul className="mt-2 space-y-1">
                      {vFiles.map((f, i) => (
                        <li key={i} className="flex items-center justify-between bg-white border border-slate-200 rounded-lg px-2 py-1">
                          <span className="truncate">{f.name} <span className="text-slate-400">({Math.max(1, Math.round(f.size / 1024))} KB)</span></span>
                          <button type="button" onClick={() => setVFiles(prev => prev.filter((_, j) => j !== i))} className="text-rose-600 font-bold ml-2">Xóa</button>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
                <div className="flex justify-end">
                  <button type="submit" className="px-5 py-2.5 rounded-xl bg-forest-600 text-white font-bold hover:bg-forest-500">
                    {vStatus === 'pending_review' ? 'Gửi kết quả cho Admin xã duyệt' : 'Lưu cập nhật'}
                  </button>
                </div>
              </form>
            )}

            {mode === 'village' && task.status === 'pending_review' && (
              <div className="p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 font-semibold">Kết quả đã được gửi và đang chờ Admin xã duyệt. Bạn chưa thể chỉnh sửa cho đến khi có phản hồi.</div>
            )}
            {mode === 'village' && task.status === 'completed' && (
              <div className="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 font-semibold">Nhiệm vụ đã được Admin xã duyệt hoàn thành{task.approvedDate ? ` ngày ${kpiFmtDate(task.approvedDate)}` : ''}.</div>
            )}

            {mode === 'admin' && task.status === 'pending_review' && (
              <div className="p-4 rounded-2xl border border-amber-200 bg-amber-50 space-y-3" data-kpi="review-box">
                <div className="font-extrabold text-slate-900">Duyệt kết quả của {task.village}</div>
                <textarea rows="2" value={note} onChange={(e) => setNote(e.target.value)} className={KPI_INPUT} placeholder="Ghi chú duyệt (bắt buộc nếu yêu cầu bổ sung)..."></textarea>
                <div className="flex flex-wrap justify-end gap-2">
                  <button type="button" onClick={() => doReview('revise')} className="px-4 py-2 rounded-xl bg-amber-500 text-white font-bold hover:bg-amber-400">Yêu cầu bổ sung</button>
                  <button type="button" onClick={() => doReview('approve')} className="px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold hover:bg-emerald-500">Duyệt hoàn thành</button>
                </div>
              </div>
            )}

            {canAdminEdit && (
              <div className="flex flex-wrap justify-end gap-2">
                <button type="button" onClick={() => onEdit(task)} className="px-4 py-2 rounded-xl bg-slate-100 font-bold hover:bg-slate-200">Sửa nhiệm vụ</button>
                <button type="button" onClick={doCancel} className="px-4 py-2 rounded-xl bg-rose-600 text-white font-bold hover:bg-rose-500">Hủy nhiệm vụ</button>
              </div>
            )}

            <div>
              <div className="font-bold text-slate-700 mb-2">Lịch sử cập nhật</div>
              {(task.history || []).length === 0 ? (
                <p className="text-slate-400 italic">Chưa có lịch sử.</p>
              ) : (
                <ol className="space-y-2 border-l-2 border-slate-200 pl-3" data-kpi="history">
                  {[...(task.history || [])].reverse().map(h => (
                    <li key={h.id} className="relative">
                      <div className="font-bold text-slate-800">{h.action} <span className="font-normal text-slate-400">· {h.actor} · {h.time}</span></div>
                      {h.note && <div className="text-slate-600">{h.note}</div>}
                    </li>
                  ))}
                </ol>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ---- Màn hình KPI của Admin xã ----
    function KpiAdminPanel({ appData, setAppData, showToast, addLog }) {
      const today = kpiToday();
      const allTasks = (appData.kpiTasks || []).filter(t => !t.villageInactive);
      const villages = (appData.villageDetails || []).map(v => v.name);
      const [fVillage, setFVillage] = useState('all');
      const [fPeriod, setFPeriod] = useState('all');
      const [fStatus, setFStatus] = useState('all');
      const [q, setQ] = useState('');
      const [formState, setFormState] = useState(null); // null | { task: null | object }
      const [viewId, setViewId] = useState(null);
      const actions = makeKpiActions({ setAppData, showToast, addLog, actor: 'Admin xã' });

      const periods = useMemo(() => Array.from(new Set(allTasks.map(t => kpiPeriod(t.deadline)))).sort().reverse(), [allTasks]);
      const scoped = allTasks.filter(t => (fVillage === 'all' || t.village === fVillage) && (fPeriod === 'all' || kpiPeriod(t.deadline) === fPeriod));
      const stats = kpiStats(scoped, today);
      const perVillage = villages.filter(v => fVillage === 'all' || v === fVillage).map(v => ({ name: v, st: kpiStats(scoped.filter(t => t.village === v), today) }));

      const keyword = q.trim().toLowerCase();
      const listed = scoped
        .filter(t => fStatus === 'all' || (fStatus === 'overdue' ? kpiIsOverdue(t, today) : t.status === fStatus))
        .filter(t => !keyword || `${t.title} ${t.description || ''} ${t.village} ${t.group}`.toLowerCase().includes(keyword))
        .sort((a, b) => (a.deadline || '').localeCompare(b.deadline || ''));

      const attention = scoped
        .filter(t => t.status !== 'cancelled' && (kpiIsOverdue(t, today) || kpiIsDueSoon(t, today) || t.status === 'pending_review' || (t.status === 'in_progress' && t.revisionRequested)))
        .sort((a, b) => (a.deadline || '').localeCompare(b.deadline || ''));

      const viewTask = viewId ? allTasks.find(t => t.id === viewId) : null;

      return (
        <div className="space-y-6" data-kpi="admin-panel">
          <div className="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h3 className="text-lg font-extrabold text-slate-900">Theo dõi KPI trưởng thôn</h3>
              <p className="text-xs text-slate-500">Giao nhiệm vụ, theo dõi tiến độ và duyệt kết quả của các thôn. Dữ liệu chỉ lưu trong trình duyệt này, chưa đồng bộ giữa nhiều người dùng hoặc thiết bị.</p>
            </div>
            <button type="button" onClick={() => setFormState({ task: null })} className="px-5 py-2.5 rounded-xl bg-community-600 text-white font-bold text-xs hover:bg-community-500 shadow shrink-0" data-kpi="new-task">+ Tạo nhiệm vụ KPI</button>
          </div>

          <KpiAlertsBox tasks={allTasks} mode="admin" onOpen={setViewId} />

          <div className="bg-white rounded-3xl p-4 border border-slate-200 shadow-sm grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs" data-kpi="filters">
            <div>
              <label className="block font-bold text-slate-600 mb-1">Thôn</label>
              <select value={fVillage} onChange={(e) => setFVillage(e.target.value)} className={KPI_INPUT} data-kpi="f-village">
                <option value="all">Tất cả các thôn</option>
                {villages.map(v => <option key={v} value={v}>{v}</option>)}
              </select>
            </div>
            <div>
              <label className="block font-bold text-slate-600 mb-1">Kỳ báo cáo (theo quý của thời hạn)</label>
              <select value={fPeriod} onChange={(e) => setFPeriod(e.target.value)} className={KPI_INPUT} data-kpi="f-period">
                <option value="all">Tất cả các kỳ</option>
                {periods.map(p => <option key={p} value={p}>{p}</option>)}
              </select>
            </div>
            <div>
              <label className="block font-bold text-slate-600 mb-1">Trạng thái (lọc danh sách)</label>
              <select value={fStatus} onChange={(e) => setFStatus(e.target.value)} className={KPI_INPUT} data-kpi="f-status">
                <option value="all">Tất cả trạng thái</option>
                <option value="not_started">Chưa bắt đầu</option>
                <option value="in_progress">Đang thực hiện</option>
                <option value="pending_review">Chờ duyệt</option>
                <option value="completed">Đã hoàn thành</option>
                <option value="overdue">Quá hạn</option>
                <option value="cancelled">Đã hủy</option>
              </select>
            </div>
            <div>
              <label className="block font-bold text-slate-600 mb-1">Tìm kiếm</label>
              <input type="text" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Tên nhiệm vụ, thôn, nhóm KPI..." className={KPI_INPUT} data-kpi="f-search" />
            </div>
          </div>

          <KpiSummary stats={stats} title="KPI" />

          <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-4" data-kpi="village-progress">
            <h4 className="text-sm font-extrabold text-slate-900">Tiến độ theo từng thôn</h4>
            <div className="space-y-4">
              {perVillage.map(({ name, st }) => (
                <div key={name} className="space-y-1.5" data-kpi-village={name}>
                  <div className="flex flex-wrap items-center justify-between gap-1 text-xs">
                    <span className="font-bold text-slate-800">{name}</span>
                    <span className="text-slate-500">{st.total} nhiệm vụ · {st.completed} hoàn thành · {st.inProgress} đang làm · {st.notStarted} chưa bắt đầu · {st.pendingReview} chờ duyệt · <span className={st.overdue ? 'text-rose-600 font-bold' : ''}>{st.overdue} quá hạn</span></span>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-[10px] text-slate-500">
                    <div className="space-y-1"><div className="flex justify-between"><span>Tiến độ thực hiện</span><b data-kpi="v-exec">{st.execProgress}%</b></div><KpiBar value={st.execProgress} color="bg-blue-500" /></div>
                    <div className="space-y-1"><div className="flex justify-between"><span>Được duyệt hoàn thành</span><b data-kpi="v-approved">{st.approvedRate}%</b></div><KpiBar value={st.approvedRate} color="bg-emerald-500" /></div>
                  </div>
                </div>
              ))}
              {perVillage.length === 0 && <p className="text-xs text-slate-400 italic">Không có thôn nào.</p>}
            </div>
          </div>

          <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-3" data-kpi="attention">
            <h4 className="text-sm font-extrabold text-slate-900">Nhiệm vụ cần chú ý hoặc sắp đến hạn ({attention.length})</h4>
            {attention.length === 0 ? (
              <p className="text-xs text-slate-400 italic">Không có nhiệm vụ nào cần chú ý trong phạm vi lọc hiện tại.</p>
            ) : (
              <div className="space-y-2">
                {attention.map(t => (
                  <button key={t.id} type="button" onClick={() => setViewId(t.id)} className="w-full text-left p-3 rounded-xl border border-slate-200 hover:bg-slate-50 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
